allProducts = data || [];

/* =========================
   大カテゴリー選択
========================= */

function selectMain(type){

  currentMain=type;

  currentPage = 1;

  currentSub="";

  currentTeam="";


  /* ボタンの色 */
  document
    .querySelectorAll("#mainFilters button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  const buttons=
    document.querySelectorAll(
      "#mainFilters button"
    );


  if(type===""){
    buttons[0].classList.add("active");
  }

  if(type==="代表"){
    buttons[1].classList.add("active");
  }

  if(type==="クラブ"){
    buttons[2].classList.add("active");
  }


  buildSubFilters();


  document.getElementById("teamFilters")
    .style.display="none";


  loadProducts();
}


/* =========================
   第2カテゴリー
========================= */

function buildSubFilters(){

  const sub=
    document.getElementById("subFilters");

  sub.innerHTML="";

  currentPage = 1;


  if(currentMain===""){

    sub.style.display="none";

    return;
  }


  sub.style.display="flex";


  /* すべて */
  const allButton=
    document.createElement("button");

  allButton.textContent="すべて";

  allButton.classList.add("active");


  allButton.onclick=()=>{

    currentSub="";

    currentTeam="";


    [...sub.children].forEach(btn=>{
      btn.classList.remove("active");
    });

    allButton.classList.add("active");


    document.getElementById("teamFilters")
      .style.display="none";


    loadProducts();
  };


  sub.appendChild(allButton);


  let values=[];


  /* =========================
     代表 → 国
  ========================= */

  if(currentMain==="代表"){

    values=[
      ...new Set(

        allProducts

          .filter(p=>
            p.item_type==="代表"
          )

          .map(p=>
            p.country ||
            p.country_or_club
          )

          .filter(Boolean)

      )
    ];
  }


  /* =========================
     クラブ → リーグ
  ========================= */

  if(currentMain==="クラブ"){

    values=[
      ...new Set(

        allProducts

          .filter(p=>
            p.item_type==="クラブ"
          )

          .map(p=>
            p.region
          )

          .filter(Boolean)

      )
    ];
  }


  /* 並び順 */
  values.sort((a,b)=>
    String(a).localeCompare(
      String(b),
      "ja"
    )
  );


  /* ボタン作成 */
  values.forEach(value=>{

    const button=
      document.createElement("button");

    button.textContent=value;


    button.onclick=()=>{

      currentSub=value;

      currentTeam="";


      [...sub.children].forEach(btn=>{
        btn.classList.remove("active");

      button.classList.add("active");


      /* クラブならチームを表示 */
      if(currentMain==="クラブ"){

        buildTeamFilters();

      }else{

        document.getElementById("teamFilters")
          .style.display="none";

      }


      loadProducts();
    };


    sub.appendChild(button);

  });

}


/* =========================
   第3カテゴリー
   クラブ → チーム
========================= */

function buildTeamFilters(){

  const team=
    document.getElementById("teamFilters");

  team.innerHTML="";

  team.style.display="flex";


  /* すべて */
  const allButton=
    document.createElement("button");

  allButton.textContent="すべて";

  allButton.classList.add("active");


  allButton.onclick=()=>{

    currentTeam="";


    [...team.children].forEach(btn=>{
      btn.classList.remove("active");
    });

    allButton.classList.add("active");


    loadProducts();
  };


  team.appendChild(allButton);


  /* 選択したリーグのチーム */
  const teams=[

    ...new Set(

      allProducts

        .filter(p=>
          p.item_type==="クラブ" &&
          p.region===currentSub
        )

        .map(p=>
          p.country_or_club
        )

        .filter(Boolean)

    )

  ];


 teams.sort((a,b)=>{
  const getYear = value => {
    const match = String(value).match(/(\d{2})-\d{2}$/);
    return match ? Number(match[1]) : 0;
  };

  const yearA = getYear(a);
  const yearB = getYear(b);

  return yearB - yearA;
});


  teams.forEach(value=>{

    const button=
      document.createElement("button");

    button.textContent=value;


    button.onclick=()=>{

      currentTeam=value;


      [...team.children].forEach(btn=>{
        btn.classList.remove("active");
      });

      button.classList.add("active");


      loadProducts();
    };


    team.appendChild(button);

  });

}


/* =========================

function renderPagination(total){

  const pagination =
    document.getElementById("pagination");

  const totalPages =
    Math.ceil(total / PAGE_SIZE);

  pagination.innerHTML = "";

  if(totalPages <= 1) return;

  for(let i = 1; i <= totalPages; i++){

    const button = document.createElement("button");

    button.textContent = i;

    button.style.cssText = `
      padding:10px 16px;
      border:1px solid #111;
      border-radius:8px;
      background:${i === currentPage ? "#111" : "#fff"};
      color:${i === currentPage ? "#fff" : "#111"};
      font-weight:bold;
    `;

    button.onclick = () => {
      currentPage = i;
      loadProducts();
      window.scrollTo({
        top:0,
        behavior:"smooth"
      });
    };

    pagination.appendChild(button);
  }
}
  function changePage(delta){
  currentPage += delta;
  loadProducts();
  window.scrollTo({top: 0, behavior: "smooth"});

return modelB.localeCompare(
  modelA,
  "ja",
  {numeric:true}
);
});

/* ページ分割 */
const totalPages = Math.max(
  1,
  Math.ceil(data.length / PAGE_SIZE)
);

if(currentPage > totalPages){
  currentPage = totalPages;
}

/* ページ番号を表示 */
renderPagination(data.length);

/* 現在のページの商品だけ表示 */
data = data.slice(
  (currentPage - 1) * PAGE_SIZE,
  currentPage * PAGE_SIZE
);

  /* 商品なし */
  document.getElementById("status")
    .textContent=
      data.length
      ? ""
      : "商品がまだ登録されていません。";


  /* 商品カード */
  document.getElementById("grid")
    .innerHTML=

    data.map(p=>`

      <article class="card">
${getCartOrder(p.id) ? `<span class="cartOrderBadge">${circledNumber(getCartOrder(p.id))}</span>` : ''}

        <div class="photo">
　　　　${p.is_new ? '<span class="newStamp">NEW</span>' : ''}
          ${
            p.image_url
            ?
            `<img
              src="${p.image_url}"
              alt="">`
            :
            "NO IMAGE"
          }

        </div>

        <div class="details">

          <div>
            <b>NAME</b>
            <span>
              ${esc(p.name)}
            </span>
          </div>

          <div>
            <b>VERSION</b>
            <span>
              ${esc(p.version||"-")}
            </span>
          </div>

          <div>
            <b>MODEL</b>
            <span>
              ${esc(p.model||"-")}
            </span>
          </div>

          <div>
            <b>PRICE</b>
            <strong>
              ¥${Number(p.price)
                .toLocaleString()}
            </strong>
          </div>

        </div>
　　　　　${Number(p.stock) <= 0 ? `
<div style="color:#e00000;font-weight:bold;font-size:18px;margin:10px 0;">
🔴 SOLD OUT
</div>
` : ""}
        <button
          class="add"
          onclick='add(${JSON.stringify(p)}, this)'>
          カートに入れる
        </button>

      </article>

    `).join("");

}


/* =========================
   HTMLエスケープ
========================= */

function esc(x){

  return String(x).replace(
    /[&<>"']/g,

    m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[m])

  );

}


/* =========================
   カート
========================= */

function add(p, btn){

    if(Number(p.stock) <= 0){
    alert("この商品はSOLD OUTです！");
    return;
  }

  cart.push(p);
  p.added = true;

  localStorage.setItem(
    "supportersCart",
    JSON.stringify(cart)
  );

const count = getCartOrder(p.id);

  if(btn){
    btn.textContent = "✓ 追加済み";
    btn.classList.add("added");

    const card = btn.closest(".card");

   if(card){
  let badge = card.querySelector(".cartOrderBadge");

  if(!badge){
    badge = document.createElement("span");
    badge.className = "cartOrderBadge";
    card.appendChild(badge);
  }

badge.textContent = circledNumber(count);
}
  }

  renderCart();

}
  function getCartOrder(id){
  return cart.filter(
    p=>String(p.id)===String(id)
  ).length;
}

function circledNumber(n){
  return String(n);
}

function changeQty(id,delta){

  if(delta>0){

    const p=
      allProducts.find(x=>
        String(x.id)===String(id)
      );

    if(p){
      cart.push(p);
    }

    
  }else{

    const index=
      cart.findIndex(p=>
        String(p.id)===String(id)
      );

    if(index!==-1){
      cart.splice(index,1);
    }

  }

  renderCart();

}


function removeProduct(id){

  cart=
    cart.filter(p=>
      String(p.id)!==String(id)
    );

  renderCart();

}


function clearCart(){

  cart=[];

  renderCart();

}


function renderCart(){

  const groups={};


  cart.forEach(p=>{

    const id=String(p.id);

    if(!groups[id]){

      groups[id]={
        product:p,
        qty:0
      };

    }

    groups[id].qty++;

  });


  const items=
    Object.values(groups);


  /* 点数 */
  document.getElementById("count")
    .textContent=
      cart.length+"点";


  /* 商品表示 */
  document.getElementById("cartItems")
    .innerHTML=

    items.map(item=>{

      const p=item.product;
      const qty=item.qty;
      const id=String(p.id);

      const price=
        Number(p.price);

      const subtotal=
        price*qty;


      return `

        <div class="cartItem"
          style="
            display:block;
            padding:10px 0;
            border-bottom:1px solid #eee;
          ">

          <div style="
            display:flex;
            justify-content:space-between;
            gap:10px;
            margin-bottom:8px;
          ">

            <span style="
              font-weight:600;
            ">
              ${esc(p.name)}
            </span>

            <span>
              ¥${subtotal.toLocaleString()}
            </span>

          </div>


          <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
          ">

            <div style="
              display:flex;
              align-items:center;
              gap:10px;
            ">

              <button
                onclick='changeQty(${JSON.stringify(id)},-1)'
                style="
                  width:34px;
                  height:34px;
                  border:1px solid #ddd;
                  border-radius:50%;
                  background:#fff;
                  font-size:20px;
                  padding:0;
                ">
                −
              </button>


              <strong style="
                min-width:20px;
                text-align:center;
                font-size:16px;
              ">
                ${qty}
              </strong>


              <button
                onclick='changeQty(${JSON.stringify(id)},1)'
                style="
                  width:34px;
                  height:34px;
                  border:1px solid #ddd;
                  border-radius:50%;
                  background:#fff;
                  font-size:20px;
                  padding:0;
                ">
                ＋
              </button>

            </div>


            <button
              onclick='removeProduct(${JSON.stringify(id)})'
              style="
                border:0;
                background:none;
                color:#888;
                font-size:13px;
              ">
              削除
            </button>

          </div>

        </div>

      `;

    }).join("");


  /* 合計 */
  const total=
    cart.reduce(
      (sum,p)=>
        sum+Number(p.price),
      0
    );


  document.getElementById("total")
    .textContent=

    cart.length
    ?
    "合計 ¥"+
    total.toLocaleString()
    :
    "";


  /* カートを空にする */
  const clearButton=
    document.getElementById("clearCart");


  if(cart.length){

    if(!clearButton){

      const btn=
        document.createElement("button");

      btn.id="clearCart";

      btn.textContent=
        "カートを空にする";

      btn.onclick=
        clearCart;

      btn.style.cssText=`
        display:block;
        width:100%;
        margin:8px 0 10px;
        padding:8px;
        border:0;
        background:none;
        color:#888;
        font-size:12px;
      `;

      document
        .getElementById("total")
        .after(btn);

    }

  }else{

    if(clearButton){
      clearButton.remove();
    }

  }


  /* LINE注文 */
  const totalQty = cart.length;
  const discount = Math.max(0, totalQty - 1) * 100;
  const discountedTotal = total - discount;
  const text=

    "【SUPPORTERS CULB 注文】\n\n"+

    items.map((item,i)=>{

      const p=item.product;

      return (

        `${i+1}. ${p.name} × ${item.qty} / `+
        `${p.version||""} / `+
        `${p.model||""} / `+
        `¥${(Number(p.price)*item.qty)
          .toLocaleString()}`

      );

    }).join("\n")+

"\n\n商品合計 ¥"+
total.toLocaleString()+
"\nセット割引 -¥"+
discount.toLocaleString()+
"\nお支払い合計 ¥"+
discountedTotal.toLocaleString()+
"\n\n━━━━━━━━━━━━━━━━━━"+
"\n【セット割引について】"+
"\n\n複数点ご購入いただいた場合、"+
"\n2点目以降、1点につき100円OFFとなります。"+
"\n\n2点 → 100円OFF"+
"\n3点 → 200円OFF"+
"\n4点 → 300円OFF"+
"\n5点 → 400円OFF"+
"\n　・"+
"\n　・"+
"\n　・"+
"\n\n※ご注文点数に応じて自動計算されます。"+
"\n━━━━━━━━━━━━━━━━━━"+
"\n\n【商品について】"+
"\n\n新品・未使用品ですが、"+
"\n海外製品のため、製造・輸送過程による"+
"\n細かな傷や個体差がある場合がございます。"+
"\n\nあらかじめご了承のうえ、"+
"\nご購入をお願いいたします。"+
"\n\n※海外製品につき、返品・交換は"+
"\nお受けしておりません。";


  const line=
    document.getElementById("line");


  line.style.display=
    cart.length
    ?
    "block"
    :
    "none";


  line.href=
    "https://line.me/R/oaMessage/%40163shzbn/?"+
    encodeURIComponent(text);

}

   スタート
========================= */

init();
loadTransferNews();
window.addEventListener("pageshow",()=>{
  cart=JSON.parse(localStorage.getItem("supportersCart")||"[]");
  loadProducts();
});


</script>
