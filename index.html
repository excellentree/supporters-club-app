<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
  
<title>SUPPORTERS CULB</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f5f5;
  color:#111;
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN",Arial,sans-serif;
  padding-bottom:100px;
}

header{
  background:#111;
  color:#fff;
  padding:20px
}

.logo{
  font-weight:900;
  letter-spacing:1px;
  font-size:22px
}

.sub{
  font-size:10px;
  opacity:.65;
  margin-top:4px
}
.card{
  position:relative;
}

.cartOrderBadge{
  position:absolute;
  top:8px;
  left:8px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:#111;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:24px;
  font-weight:900;
  z-index:5;
}

.add.added{
  background:#555;
  color:#fff;
}
  .add{
  transition:transform .1s ease, filter .1s ease;
}

.add:active{
  transform:scale(.94);
  filter:brightness(.8);
}
.hero{
  background:#fff;
  padding:28px 20px;
  border-bottom:1px solid #ddd
}

.hero h1{
  margin:0;
  font-size:28px
}

.hero p{
  margin:7px 0 0;
  color:#666
}

.content{
  padding:16px
}

/* カテゴリー */
.filters{
  display:flex;
  gap:8px;
  margin-bottom:10px;
  overflow-x:auto;
  padding-bottom:4px;
  -webkit-overflow-scrolling:touch
}

.filters button{
  background:#fff;
  border:1px solid #ddd;
  border-radius:999px;
  padding:9px 18px;
  white-space:nowrap;
  font-size:14px
}

.filters button.active{
  background:#111;
  color:#fff;
  border-color:#111
}

/* 商品 */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px
}

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 2px 10px #0000000d
}
  .card:only-child{
  grid-column:1 / -1;
  justify-self:center;
  width:100%;
  max-width:370px;
}

.photo{
  position:relative;
  aspect-ratio:1;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#aaa
}
.newStamp{
  position:absolute;
  top:8px;
  left:8px;
  background:#111;
  color:#fff;
  font-size:14px;
  font-weight:900;
  padding:6px 9px;
  border-radius:6px;
  z-index:3;
  box-shadow:0 2px 5px #0003;
}
.photo img{
  width:100%;
  height:100%;
  object-fit:cover
}

.details{
  padding:10px
}

.details div{
  display:flex;
  gap:8px;
  font-size:12px;
  margin:5px 0
}

.details b{
  font-size:9px;
  color:#888;
  min-width:55px
}

.details strong{
  font-size:15px
}

.add{
  display:block;
  width:calc(100% - 20px);
  margin:10px;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#111;
  color:#fff;
  font-weight:700
}

/* カート */
.cart{
  position:sticky;
  bottom:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:14px 16px;
  box-shadow:0 -4px 15px #0001
}

.cartHead{
  display:flex;
  justify-content:space-between
}

.cartItem{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
  font-size:13px
}

.cartItem button{
  border:0;
  background:none;
  color:#888
}

.total{
  text-align:right;
  font-weight:800;
  margin:8px 0
}

.line{
  display:block;
  background:#06c755;
  color:#fff;
  text-decoration:none;
  text-align:center;
  padding:13px;
  border-radius:8px;
  font-weight:800
}

@media(min-width:700px){
  .grid{
    grid-template-columns:repeat(3,1fr);
    max-width:1000px
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SUPPORTERS CULB</div>
  <div class="sub">FOOTBALL GOODS</div>
</header>

<section class="hero">
  <h1>SOCCERWE</h1>
  <p>サッカーグッズを選んで注文</p>
</section>

<div class="content">

  <!-- 大カテゴリー -->
  <div class="filters" id="mainFilters">
    <button class="active" onclick="selectMain('')">
      すべて
    </button>

    <button onclick="selectMain('代表')">
      代表
    </button>

    <button onclick="selectMain('クラブ')">
      クラブ
    </button>
  </div>

  <!-- 国・リーグ -->
  <div
    class="filters"
    id="subFilters"
    style="display:none">
  </div>

  <!-- チーム -->
  <div
    class="filters"
    id="teamFilters"
    style="display:none">
  </div>

  <div id="status">
    商品を読み込み中…
  </div>

  <div id="grid" class="grid"></div>

</div>

  <div style="position:fixed;bottom:20px;left:20px;right:20px;text-align:center;z-index:9999;">
<a href="cart.html" style="display:block;background:#111;color:#fff;padding:18px;border-radius:16px;text-decoration:none;font-weight:bold;font-size:20px;">
🛒 カートを見る
</a>
</div>
  
<!-- カート -->
<aside class="cart" style="display:none">

  <div class="cartHead">
    <b>カート</b>
    <span id="count">0点</span>
  </div>

  <div id="cartItems"></div>

  <div class="total" id="total"></div>

  <a
    id="line"
    class="line"
    style="display:none"
    href="#">
    LINEで注文する
  </a>

</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   Supabase
========================= */

const SUPABASE_URL=
  "https://juzrxqrabrvhlwvnvton.supabase.co";

const SUPABASE_KEY=
  "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";

const sb=
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   状態
========================= */

let cart=[];

let allProducts=[];

let currentMain="";

let currentSub="";

let currentTeam="";


/* =========================
   商品を取得
========================= */

async function init(){

  document.getElementById("status")
    .textContent="商品を読み込み中…";

  const {data,error}=await sb
    .from("products")
    .select("*")
    .order("id",{ascending:false});

  if(error){

    document.getElementById("status")
      .textContent=
      "商品を読み込めませんでした。";

    console.error(error);

    return;
  }

  allProducts=data || [];

  loadProducts();
}


/* =========================
   大カテゴリー選択
========================= */

function selectMain(type){

  currentMain=type;

  currentSub="";

  currentTeam="";


  /* ボタンの色 */
  document
    .querySelectorAll("#mainFilters button")
    .forEach(btn=>{
      btn.classList.remove("active");
    });


  const buttons=
    document.querySelectorAll(
      "#mainFilters button"
    );


  if(type===""){
    buttons[0].classList.add("active");
  }

  if(type==="代表"){
    buttons[1].classList.add("active");
  }

  if(type==="クラブ"){
    buttons[2].classList.add("active");
  }


  buildSubFilters();


  document.getElementById("teamFilters")
    .style.display="none";


  loadProducts();
}


/* =========================
   第2カテゴリー
========================= */

function buildSubFilters(){

  const sub=
    document.getElementById("subFilters");

  sub.innerHTML="";


  if(currentMain===""){

    sub.style.display="none";

    return;
  }


  sub.style.display="flex";


  /* すべて */
  const allButton=
    document.createElement("button");

  allButton.textContent="すべて";

  allButton.classList.add("active");


  allButton.onclick=()=>{

    currentSub="";

    currentTeam="";


    [...sub.children].forEach(btn=>{
      btn.classList.remove("active");
    });

    allButton.classList.add("active");


    document.getElementById("teamFilters")
      .style.display="none";


    loadProducts();
  };


  sub.appendChild(allButton);


  let values=[];


  /* =========================
     代表 → 国
  ========================= */

  if(currentMain==="代表"){

    values=[
      ...new Set(

        allProducts

          .filter(p=>
            p.item_type==="代表"
          )

          .map(p=>
            p.country ||
            p.country_or_club
          )

          .filter(Boolean)

      )
    ];
  }


  /* =========================
     クラブ → リーグ
  ========================= */

  if(currentMain==="クラブ"){

    values=[
      ...new Set(

        allProducts

          .filter(p=>
            p.item_type==="クラブ"
          )

          .map(p=>
            p.region
          )

          .filter(Boolean)

      )
    ];
  }


  /* 並び順 */
  values.sort((a,b)=>
    String(a).localeCompare(
      String(b),
      "ja"
    )
  );


  /* ボタン作成 */
  values.forEach(value=>{

    const button=
      document.createElement("button");

    button.textContent=value;


    button.onclick=()=>{

      currentSub=value;

      currentTeam="";


      [...sub.children].forEach(btn=>{
        btn.classList.remove("active");
      });

      button.classList.add("active");


      /* クラブならチームを表示 */
      if(currentMain==="クラブ"){

        buildTeamFilters();

      }else{

        document.getElementById("teamFilters")
          .style.display="none";

      }


      loadProducts();
    };


    sub.appendChild(button);

  });

}


/* =========================
   第3カテゴリー
   クラブ → チーム
========================= */

function buildTeamFilters(){

  const team=
    document.getElementById("teamFilters");

  team.innerHTML="";

  team.style.display="flex";


  /* すべて */
  const allButton=
    document.createElement("button");

  allButton.textContent="すべて";

  allButton.classList.add("active");


  allButton.onclick=()=>{

    currentTeam="";


    [...team.children].forEach(btn=>{
      btn.classList.remove("active");
    });

    allButton.classList.add("active");


    loadProducts();
  };


  team.appendChild(allButton);


  /* 選択したリーグのチーム */
  const teams=[

    ...new Set(

      allProducts

        .filter(p=>
          p.item_type==="クラブ" &&
          p.region===currentSub
        )

        .map(p=>
          p.country_or_club
        )

        .filter(Boolean)

    )

  ];


 teams.sort((a,b)=>{
  const getYear = value => {
    const match = String(value).match(/(\d{2})-\d{2}$/);
    return match ? Number(match[1]) : 0;
  };

  const yearA = getYear(a);
  const yearB = getYear(b);

  return yearB - yearA;
});


  teams.forEach(value=>{

    const button=
      document.createElement("button");

    button.textContent=value;


    button.onclick=()=>{

      currentTeam=value;


      [...team.children].forEach(btn=>{
        btn.classList.remove("active");
      });

      button.classList.add("active");


      loadProducts();
    };


    team.appendChild(button);

  });

}


/* =========================
   商品を表示
========================= */

function loadProducts(){

  let data=[
    ...allProducts
  ];


  /* 大カテゴリー */
  if(currentMain){

    data=data.filter(p=>
      p.item_type===currentMain
    );

  }


  /* =========================
     代表 → 国
  ========================= */

  if(
    currentMain==="代表" &&
    currentSub
  ){

    data=data.filter(p=>{

      const country=
        p.country ||
        p.country_or_club;

      return country===currentSub;

    });

  }


  /* =========================
     クラブ → リーグ
  ========================= */

  if(
    currentMain==="クラブ" &&
    currentSub
  ){

    data=data.filter(p=>
      p.region===currentSub
    );

  }


  /* =========================
     クラブ → リーグ → チーム
  ========================= */

  if(
    currentMain==="クラブ" &&
    currentSub &&
    currentTeam
  ){

    data=data.filter(p=>
      p.country_or_club===currentTeam
    );

  }
/* MODEL順に並べる */
data.sort((a,b)=>{
  const modelA=String(a.model||"");
  const modelB=String(b.model||"");

return modelB.localeCompare(
  modelA,
  "ja",
  {numeric:true}
);
});

  /* 商品なし */
  document.getElementById("status")
    .textContent=
      data.length
      ? ""
      : "商品がまだ登録されていません。";


  /* 商品カード */
  document.getElementById("grid")
    .innerHTML=

    data.map(p=>`

      <article class="card">
${getCartOrder(p.id) ? `<span class="cartOrderBadge">${circledNumber(getCartOrder(p.id))}</span>` : ''}

        <div class="photo">
　　　　　${p.is_new ? `<span class="newStamp">NEW</span>` : ""}
          ${
            p.image_url
            ?
            `<img
              src="${p.image_url}"
              alt="">`
            :
            "NO IMAGE"
          }

        </div>

        <div class="details">

          <div>
            <b>NAME</b>
            <span>
              ${esc(p.name)}
            </span>
          </div>

          <div>
            <b>VERSION</b>
            <span>
              ${esc(p.version||"-")}
            </span>
          </div>

          <div>
            <b>MODEL</b>
            <span>
              ${esc(p.model||"-")}
            </span>
          </div>

          <div>
            <b>PRICE</b>
            <strong>
              ¥${Number(p.price)
                .toLocaleString()}
            </strong>
          </div>

        </div>
　　　　　　${p.sold_out ? `
<div style="color:#e00000;font-weight:bold;font-size:18px;margin:10px 0;">
🔴 SOLD OUT
</div>
` : ""}
        <button
          class="add"
          onclick='add(${JSON.stringify(p)}, this)'>
          カートに入れる
        </button>

      </article>

    `).join("");

}


/* =========================
   HTMLエスケープ
========================= */

function esc(x){

  return String(x).replace(
    /[&<>"']/g,

    m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"

    }[m])

  );

}


/* =========================
   カート
========================= */

function add(p, btn){

  cart.push(p);
  p.added = true;

  localStorage.setItem(
    "supportersCart",
    JSON.stringify(cart)
  );

const count = getCartOrder(p.id);

  if(btn){
    btn.textContent = "✓ 追加済み";
    btn.classList.add("added");

    const card = btn.closest(".card");

   if(card){
  let badge = card.querySelector(".cartOrderBadge");

  if(!badge){
    badge = document.createElement("span");
    badge.className = "cartOrderBadge";
    card.appendChild(badge);
  }

badge.textContent = circledNumber(count);
}
  }

  renderCart();

}
  function getCartOrder(id){
  return cart.filter(
    p=>String(p.id)===String(id)
  ).length;
}

function circledNumber(n){
  return String(n);
}

function changeQty(id,delta){

  if(delta>0){

    const p=
      allProducts.find(x=>
        String(x.id)===String(id)
      );

    if(p){
      cart.push(p);
    }

    
  }else{

    const index=
      cart.findIndex(p=>
        String(p.id)===String(id)
      );

    if(index!==-1){
      cart.splice(index,1);
    }

  }

  renderCart();

}


function removeProduct(id){

  cart=
    cart.filter(p=>
      String(p.id)!==String(id)
    );

  renderCart();

}


function clearCart(){

  cart=[];

  renderCart();

}


function renderCart(){

  const groups={};


  cart.forEach(p=>{

    const id=String(p.id);

    if(!groups[id]){

      groups[id]={
        product:p,
        qty:0
      };

    }

    groups[id].qty++;

  });


  const items=
    Object.values(groups);


  /* 点数 */
  document.getElementById("count")
    .textContent=
      cart.length+"点";


  /* 商品表示 */
  document.getElementById("cartItems")
    .innerHTML=

    items.map(item=>{

      const p=item.product;
      const qty=item.qty;
      const id=String(p.id);

      const price=
        Number(p.price);

      const subtotal=
        price*qty;


      return `

        <div class="cartItem"
          style="
            display:block;
            padding:10px 0;
            border-bottom:1px solid #eee;
          ">

          <div style="
            display:flex;
            justify-content:space-between;
            gap:10px;
            margin-bottom:8px;
          ">

            <span style="
              font-weight:600;
            ">
              ${esc(p.name)}
            </span>

            <span>
              ¥${subtotal.toLocaleString()}
            </span>

          </div>


          <div style="
            display:flex;
            align-items:center;
            justify-content:space-between;
          ">

            <div style="
              display:flex;
              align-items:center;
              gap:10px;
            ">

              <button
                onclick='changeQty(${JSON.stringify(id)},-1)'
                style="
                  width:34px;
                  height:34px;
                  border:1px solid #ddd;
                  border-radius:50%;
                  background:#fff;
                  font-size:20px;
                  padding:0;
                ">
                −
              </button>


              <strong style="
                min-width:20px;
                text-align:center;
                font-size:16px;
              ">
                ${qty}
              </strong>


              <button
                onclick='changeQty(${JSON.stringify(id)},1)'
                style="
                  width:34px;
                  height:34px;
                  border:1px solid #ddd;
                  border-radius:50%;
                  background:#fff;
                  font-size:20px;
                  padding:0;
                ">
                ＋
              </button>

            </div>


            <button
              onclick='removeProduct(${JSON.stringify(id)})'
              style="
                border:0;
                background:none;
                color:#888;
                font-size:13px;
              ">
              削除
            </button>

          </div>

        </div>

      `;

    }).join("");


  /* 合計 */
  const total=
    cart.reduce(
      (sum,p)=>
        sum+Number(p.price),
      0
    );


  document.getElementById("total")
    .textContent=

    cart.length
    ?
    "合計 ¥"+
    total.toLocaleString()
    :
    "";


  /* カートを空にする */
  const clearButton=
    document.getElementById("clearCart");


  if(cart.length){

    if(!clearButton){

      const btn=
        document.createElement("button");

      btn.id="clearCart";

      btn.textContent=
        "カートを空にする";

      btn.onclick=
        clearCart;

      btn.style.cssText=`
        display:block;
        width:100%;
        margin:8px 0 10px;
        padding:8px;
        border:0;
        background:none;
        color:#888;
        font-size:12px;
      `;

      document
        .getElementById("total")
        .after(btn);

    }

  }else{

    if(clearButton){
      clearButton.remove();
    }

  }


  /* LINE注文 */
  const totalQty = cart.length;
  const discount = Math.max(0, totalQty - 1) * 100;
  const discountedTotal = total - discount;
  const text=

    "【SUPPORTERS CULB 注文】\n\n"+

    items.map((item,i)=>{

      const p=item.product;

      return (

        `${i+1}. ${p.name} × ${item.qty} / `+
        `${p.version||""} / `+
        `${p.model||""} / `+
        `¥${(Number(p.price)*item.qty)
          .toLocaleString()}`

      );

    }).join("\n")+

"\n\n商品合計 ¥"+
total.toLocaleString()+
"\nセット割引 -¥"+
discount.toLocaleString()+
"\nお支払い合計 ¥"+
discountedTotal.toLocaleString()+
"\n\n━━━━━━━━━━━━━━━━━━"+
"\n【セット割引について】"+
"\n\n複数点ご購入いただいた場合、"+
"\n2点目以降、1点につき100円OFFとなります。"+
"\n\n2点 → 100円OFF"+
"\n3点 → 200円OFF"+
"\n4点 → 300円OFF"+
"\n5点 → 400円OFF"+
"\n　・"+
"\n　・"+
"\n　・"+
"\n\n※ご注文点数に応じて自動計算されます。"+
"\n━━━━━━━━━━━━━━━━━━"+
"\n\n【商品について】"+
"\n\n新品・未使用品ですが、"+
"\n海外製品のため、製造・輸送過程による"+
"\n細かな傷や個体差がある場合がございます。"+
"\n\nあらかじめご了承のうえ、"+
"\nご購入をお願いいたします。"+
"\n\n※海外製品につき、返品・交換は"+
"\nお受けしておりません。";


  const line=
    document.getElementById("line");


  line.style.display=
    cart.length
    ?
    "block"
    :
    "none";


  line.href=
    "https://line.me/R/oaMessage/%40163shzbn/?"+
    encodeURIComponent(text);

}

/* =========================
   スタート
========================= */

init();

window.addEventListener("pageshow",()=>{
  cart=JSON.parse(localStorage.getItem("supportersCart")||"[]");
  loadProducts();
});


</script>

</body>
</html>
