<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPPORTERS CULB 画像移行</title>
<style>
body{font-family:Arial,sans-serif;padding:20px;max-width:700px;margin:auto;background:#f7f7f7}
button{padding:12px 18px;margin:8px 0;border:0;border-radius:8px;background:#222;color:white;font-size:16px}
input{width:100%;padding:12px;box-sizing:border-box;margin:8px 0}
#log{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:14px;border-radius:8px}
</style>
</head>
<body>
<h2>SUPPORTERS CULB</h2>
<h3>Supabase → Cloudflare R2 画像コピー</h3>
<p>画像をコピーします。元画像と商品データは変更・削除しません。同じブラウザにコピー記録を保存します。</p>

<label>Cloudflare Worker アップロードキー</label>
<input id="uploadKey" type="password" autocomplete="off" placeholder="アップロードキーを入力">

<button id="start">画像コピーを開始</button>
<button id="checkUpdates">R2コピー記録を確認</button>
  <div id="log">まだ開始していません。</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://juzrxqrabrvhlwvnvton.supabase.co";
const SUPABASE_KEY = "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";
const BUCKET = "product-images";
const WORKER_URL = "https://supporters-image-api.excellentree-55.workers.dev";
const MAP_KEY = "supporters_r2_image_migration_v1";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const log = document.getElementById("log");
const button = document.getElementById("start");
document.getElementById("checkUpdates")?.addEventListener("click", async () => {
  const log = document.getElementById("log");
  log.textContent = "コピー記録を確認中…";

  try {
    const mapping = JSON.parse(
      localStorage.getItem("supporters_r2_image_migration_v1") || "{}"
    );

    const entries = Object.entries(mapping);

    log.textContent =
      "R2コピー記録の確認結果\n\n" +
      "記録件数：" + entries.length + "件\n\n" +
      "先頭5件：\n" +
      entries.slice(0, 5).map(([oldPath, newUrl]) =>
        oldPath + "\n→ " + newUrl
      ).join("\n\n") +
      "\n\n商品データはまだ変更していません。";
  } catch (error) {
    log.textContent = "確認エラー：\n" +
      (error.message || String(error));
  }
});
button.addEventListener("click", async () => {
  const uploadKey = document.getElementById("uploadKey").value.trim();
  if (!uploadKey) {
    alert("Cloudflare Workerのアップロードキーを入力してください");
    return;
  }

  if (!confirm("画像をR2へコピーします。元画像と商品データは変更しません。開始しますか？")) return;

  button.disabled = true;
  let success = 0;
  let failed = 0;
  let skipped = 0;
  const errors = [];
  let mapping = {};

  try {
    mapping = JSON.parse(localStorage.getItem(MAP_KEY) || "{}");
    log.textContent = "Supabaseの画像一覧を取得中…";

    const files = [];
    let offset = 0;

    while (true) {
      const {data, error} = await sb.storage.from(BUCKET).list("", {
        limit: 100,
        offset,
        sortBy: {column: "name", order: "asc"}
      });

      if (error) throw error;
      if (!data || data.length === 0) break;

      for (const item of data) {
        if (item.name && item.id !== null) files.push(item.name);
      }

      if (data.length < 100) break;
      offset += data.length;
    }

    if (!files.length) throw new Error("画像ファイルが見つかりませんでした");

    log.textContent = "画像 " + files.length + "件を確認しました。\nコピーを開始します…";

    for (let i = 0; i < files.length; i++) {
      const path = files[i];

      if (mapping[path]) {
        skipped++;
        continue;
      }

      try {
        log.textContent =
          "コピー中… " + (i + 1) + "/" + files.length +
          "\n成功：" + success + "\n失敗：" + failed +
          "\n\n現在：" + path;

        const {data: blob, error: downloadError} =
          await sb.storage.from(BUCKET).download(path);

        if (downloadError) throw downloadError;
        if (!blob) throw new Error("画像をダウンロードできませんでした");

        const type = blob.type || (
          /\.png$/i.test(path) ? "image/png" :
          /\.webp$/i.test(path) ? "image/webp" :
          /\.gif$/i.test(path) ? "image/gif" :
          /\.jpe?g$/i.test(path) ? "image/jpeg" : ""
        );

        if (!type.startsWith("image/")) {
          throw new Error("画像形式を判定できません: " + type);
        }

        const response = await fetch(WORKER_URL + "/upload", {
          method: "POST",
          headers: {
            "Content-Type": type,
            "X-Upload-Key": uploadKey
          },
          body: blob
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || result.message || "HTTP " + response.status);
        }
        if (!result.url) throw new Error("R2の画像URLが返されませんでした");

        mapping[path] = result.url;
        localStorage.setItem(MAP_KEY, JSON.stringify(mapping));
        success++;
      } catch (e) {
        failed++;
        errors.push(path + "： " + (e.message || String(e)));
      }
    }

    log.textContent =
      "コピー処理終了\n\n" +
      "対象画像：" + files.length + "件\n" +
      "今回の成功：" + success + "件\n" +
      "失敗：" + failed + "件\n" +
      "以前のコピー記録によるスキップ：" + skipped + "件\n\n" +
      "コピー記録：" + Object.keys(mapping).length + "件\n\n" +
      (errors.length ? "失敗内容：\n" + errors.join("\n") :
      "エラーはありませんでした。") +
      "\n\n商品データのURLはまだ変更していません。";

  } catch (e) {
    log.textContent = "処理を開始できませんでした。\n" +
      (e.message || String(e)) +
      "\n\n元画像と商品データは変更していません。";
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
