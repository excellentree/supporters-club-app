

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUPPORTERS CULB 画像確認</title>
<style>
body{font-family:Arial,sans-serif;padding:20px;max-width:700px;margin:auto;background:#f7f7f7}
button{padding:12px 18px;margin:8px 0;border:0;border-radius:8px;background:#222;color:white;font-size:16px}
#log{white-space:pre-wrap;overflow-wrap:anywhere;background:white;padding:12px;border-radius:8px}
</style>
</head>
<body>
<h2>SUPPORTERS CULB</h2>
<h3>Supabase画像の取得テスト</h3>
<p>このテストは画像一覧の取得だけを行います。画像のコピー・削除・商品データの変更は行いません。</p>
<button id="check">画像一覧を確認</button>
<div id="log">まだ確認していません。</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://juzrxqrabrvhlwvnvton.supabase.co";
const SUPABASE_KEY = "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";
const BUCKET = "product-images";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const log = document.getElementById("log");

document.getElementById("check").addEventListener("click", async () => {
  log.textContent = "Supabaseに接続中…";
  try {
       const files = [];
    let offset = 0;

    while (true) {
      const { data, error } = await sb.storage.from(BUCKET).list("", {
        limit: 100,
        offset,
        sortBy: { column: "name", order: "asc" }
      });

      if (error) throw error;
      if (!data || data.length === 0) break;

      files.push(...data);
      if (data.length < 100) break;
      offset += data.length;
    }

    log.textContent =
      "取得成功\n" +
      "返却件数: " + files.length + "\n\n" +
      "返却データ:\n" +
      JSON.stringify(files, null, 2);
  } catch (error) {
    log.textContent = "処理エラー:\n" +
      (error?.message || String(error));
  }
});
</script>
</body>
</html>
