<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPPORTERS CULB 経費管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
:root{--ink:#222;--paper:#f4f4f0;--muted:#777;--line:#ddd;--green:#e0f1e4;--red:#f8e5e3}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans JP",sans-serif}
header{background:#222;color:white;padding:28px 20px}
header h1{font-size:25px;margin:0 0 8px}
header p{margin:0;color:#ccc;font-size:15px}
main{max-width:900px;margin:22px auto;padding:0 14px 36px}
.card{background:#fff;border-radius:22px;padding:22px;margin-bottom:18px;box-shadow:0 4px 18px #00000008}
.monthbar{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:22px}
.monthbar h2{font-size:23px;text-align:center;margin:0;white-space:nowrap}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;cursor:pointer}
.btn-light{background:#eee;color:#222}
.btn-dark{background:#222;color:#fff}
.btn-red{background:var(--red);color:#a22}
.monthbar button{background:#eee;color:#222}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sum-box{background:#f3f3f0;padding:20px;border-radius:18px;color:#666}
.sum-box strong{display:block;font-size:28px;color:#222;margin-top:8px}
.sum-total{grid-column:1/-1;background:#222;color:#ccc}
.sum-total strong{color:white}
h2.section-title{font-size:23px;margin:0 0 22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.tabs button{background:#e5e5e1;color:#444}
.tabs button.active,.filter button.active{background:#222;color:#fff}
label{display:block;font-weight:700;font-size:17px;margin:18px 0 9px}
input,textarea{width:100%;padding:16px;border:2px solid #d5d5d5;border-radius:14px;font:inherit;font-size:18px;background:#fff;color:#222}
textarea{min-height:86px;resize:vertical}
input:focus,textarea:focus{outline:2px solid #aaa}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.calc-box{padding:16px;background:#f4f4f1;border-radius:14px;margin-top:16px}
.calc-line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:4px 0}
.calc-line strong{font-size:22px}
.receipt-toggle{width:100%;background:#eee;color:#555;border:2px solid transparent}
.receipt-toggle.yes{background:var(--green);border-color:#70ae7f;color:#246b3c}
#saveBtn{width:100%;margin-top:22px;font-size:18px}
#message{min-height:26px;margin-top:12px;font-weight:700}
#message.ok{color:#267342}#message.err{color:#b42332}
.filter{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.filter button{background:#e5e5e1;color:#444}
.day{margin-top:24px}
.day h3{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.expense-row{padding:16px 0;border-bottom:1px solid #eee}
.row-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.row-name{font-size:19px;font-weight:700;overflow-wrap:anywhere}
.row-amount{font-size:20px;font-weight:700;white-space:nowrap}
.details{color:#777;font-size:15px;margin-top:8px;line-height:1.6}
.badge{display:inline-block;background:#eee;color:#444;border-radius:8px;padding:5px 9px;font-size:14px;margin-top:8px}
.row-actions{display:flex;gap:8px;margin-top:12px}
.row-actions button{padding:10px 16px}
.day-total{text-align:right;color:#666;padding-top:12px}
.month-total{text-align:right;font-weight:700;font-size:21px;margin-top:20px}
.empty{text-align:center;color:#888;padding:35px 10px}
footer{text-align:center;color:#888;padding:20px;font-size:14px}
@media(max-width:560px){
 header{padding:24px 16px}header h1{font-size:23px}
 main{padding:0 12px 28px;margin-top:16px}
 .card{padding:18px;border-radius:20px}
 .monthbar{gap:5px}.monthbar h2{font-size:19px}.monthbar button{padding:12px 8px;font-size:14px}
 .summary{gap:10px}.sum-box{padding:16px}.sum-box strong{font-size:25px}
 .fields{grid-template-columns:1fr}
 .filter{gap:8px}.filter button{padding:13px 5px}
 .row-top{align-items:flex-start}.row-name{font-size:18px}.row-amount{font-size:18px}
}
</style>
</head>
<body>
<header>
  <h1>SUPPORTERS CULB</h1>
  <p>経費管理 / EXPENSES</p>
</header>
<main>
  <section class="card">
    <div class="monthbar">
      <button onclick="moveMonth(-1)">◀ 前月</button>
      <h2 id="monthTitle">----</h2>
      <button onclick="moveMonth(1)">翌月 ▶</button>
    </div>
    <div class="summary">
      <div class="sum-box">📦 商品等の仕入れ<strong id="purchaseTotal">¥0</strong></div>
      <div class="sum-box">🧾 雑費<strong id="miscTotal">¥0</strong></div>
      <div class="sum-box sum-total">💰 今月の経費総額<strong id="allTotal">¥0</strong></div>
    </div>
  </section>

  <section class="card">
    <h2 class="section-title">経費を登録</h2>
    <div class="tabs">
      <button id="purchaseTab" class="active" onclick="switchType('purchase')">📦 商品仕入れ</button>
      <button id="miscTab" onclick="switchType('misc')">🧾 雑費</button>
    </div>
    <form id="expenseForm">
      <label for="dateInput">日付</label>
      <input id="dateInput" type="date" required>

      <label for="descriptionInput" id="descriptionLabel">商品名</label>
      <input id="descriptionInput" type="text" maxlength="200" placeholder="例：サッカーフィギュア" required>

      <div id="purchaseFields">
        <div class="fields">
          <div>
            <label for="quantityInput">数量</label>
            <input id="quantityInput" type="number" min="0.01" step="0.01" value="1" inputmode="decimal" required>
          </div>
          <div>
            <label for="amountInput">合計金額（円）</label>
            <input id="amountInput" type="number" min="0" step="1" placeholder="例：12000" inputmode="numeric" required>
          </div>
        </div>
        <div class="calc-box">
          <div class="calc-line"><span>1個あたりの仕入れ単価</span><strong id="unitPriceDisplay">—</strong></div>
          <div class="calc-line"><span>合計金額</span><strong id="purchaseAmountDisplay">¥0</strong></div>
        </div>
      </div>

      <div id="miscFields" hidden>
        <label for="miscAmountInput">金額（円）</label>
        <input id="miscAmountInput" type="number" min="0" step="1" placeholder="例：500" inputmode="numeric">
      </div>

      <label>領収書</label>
      <button type="button" id="receiptBtn" class="receipt-toggle" aria-pressed="false" onclick="toggleReceipt()">▢ 領収書なし</button>

      <label for="memoInput">メモ（任意）</label>
      <textarea id="memoInput" placeholder="購入先・用途など"></textarea>

      <button id="saveBtn" class="btn-dark" type="submit">経費を登録する</button>
      <button id="cancelEditBtn" class="btn-light" type="button" onclick="resetForm()" hidden style="width:100%;margin-top:10px">編集をキャンセル</button>
      <div id="message" role="status"></div>
    </form>
  </section>

  <section class="card">
    <h2 class="section-title">📋 今月の経費一覧</h2>
    <div class="filter">
      <button class="active" data-filter="all" onclick="setFilter('all')">すべて</button>
      <button data-filter="purchase" onclick="setFilter('purchase')">仕入れ</button>
      <button data-filter="misc" onclick="setFilter('misc')">雑費</button>
    </div>
    <div id="expenseList"><div class="empty">読み込み中...</div></div>
    <div id="monthGrandTotal" class="month-total"></div>
  </section>
</main>
<footer>SUPPORTERS CULB EXPENSE MANAGEMENT</footer>

<script>
const SUPABASE_URL = "https://juzrxqrabrvhlwvnvton.supabase.co";
const SUPABASE_KEY = "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentMonth = new Date();
currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
let currentType = "purchase";
let currentFilter = "all";
let editingId = null;
let receiptPresent = false;
let records = [];

const $ = id => document.getElementById(id);
const yen = value => "¥" + Number(value || 0).toLocaleString("ja-JP", {maximumFractionDigits:2});
const localDateString = date => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,"0")}-${String(date.getDate()).padStart(2,"0")}`;
const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));

function setMessage(text, kind=""){
  $("message").textContent = text;
  $("message").className = kind;
}
function moveMonth(delta){
  currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth()+delta, 1);
  $("monthTitle").textContent = `${currentMonth.getFullYear()}年${currentMonth.getMonth()+1}月`;
  loadExpenses();
}
function switchType(type){
  currentType = type;
  $("purchaseTab").classList.toggle("active", type==="purchase");
  $("miscTab").classList.toggle("active", type==="misc");
  $("purchaseFields").hidden = type!=="purchase";
  $("miscFields").hidden = type!=="misc";
  $("descriptionLabel").textContent = type==="purchase" ? "商品名" : "内容";
  $("descriptionInput").placeholder = type==="purchase" ? "例：サッカーフィギュア" : "例：梱包資材・コピー代";
  $("quantityInput").required = type==="purchase";
  $("amountInput").required = type==="purchase";
  $("miscAmountInput").required = type==="misc";
  $("saveBtn").textContent = editingId ? "変更を保存する" : (type==="purchase" ? "仕入れを登録する" : "雑費を登録する");
}
function toggleReceipt(){
  receiptPresent = !receiptPresent;
  $("receiptBtn").classList.toggle("yes", receiptPresent);
  $("receiptBtn").textContent = receiptPresent ? "☑ 領収書あり" : "▢ 領収書なし";
  $("receiptBtn").setAttribute("aria-pressed", String(receiptPresent));
}
function updatePurchaseCalc(){
  const quantity = Number($("quantityInput").value);
  const amount = Number($("amountInput").value);
  $("purchaseAmountDisplay").textContent = yen(amount);
  $("unitPriceDisplay").textContent = quantity > 0 && $("amountInput").value !== "" ? yen(amount/quantity) : "—";
}
$("quantityInput").addEventListener("input", updatePurchaseCalc);
$("amountInput").addEventListener("input", updatePurchaseCalc);

function resetForm(){
  editingId = null;
  $("expenseForm").reset();
  $("dateInput").value = localDateString(new Date());
  $("quantityInput").value = "1";
  receiptPresent = false;
  $("receiptBtn").classList.remove("yes");
  $("receiptBtn").textContent = "▢ 領収書なし";
  $("receiptBtn").setAttribute("aria-pressed","false");
  $("cancelEditBtn").hidden = true;
  $("saveBtn").textContent = currentType==="purchase" ? "仕入れを登録する" : "雑費を登録する";
  setMessage("");
  updatePurchaseCalc();
  switchType(currentType);
}
function setFilter(filter){
  currentFilter = filter;
  document.querySelectorAll("[data-filter]").forEach(button => button.classList.toggle("active",button.dataset.filter===filter));
  renderList();
}
function monthRange(){
  const first = new Date(currentMonth.getFullYear(),currentMonth.getMonth(),1);
  const last = new Date(currentMonth.getFullYear(),currentMonth.getMonth()+1,0);
  return {first:localDateString(first),last:localDateString(last)};
}
async function loadExpenses(){
  $("monthTitle").textContent = `${currentMonth.getFullYear()}年${currentMonth.getMonth()+1}月`;
  const {first,last} = monthRange();
  const {data,error} = await db.from("expenses").select("*").gte("expense_date",first).lte("expense_date",last).order("expense_date",{ascending:false}).order("id",{ascending:false});
  if(error){
    records = [];
    $("expenseList").innerHTML = `<div class="empty">読み込みエラー：${escapeHtml(error.message)}</div>`;
    $("purchaseTotal").textContent = "—";
    $("miscTotal").textContent = "—";
    $("allTotal").textContent = "—";
    $("monthGrandTotal").textContent = "";
    return;
  }
  records = data || [];
  const purchases = records.filter(row=>row.expense_type==="purchase").reduce((sum,row)=>sum+Number(row.amount||0),0);
  const misc = records.filter(row=>row.expense_type==="misc").reduce((sum,row)=>sum+Number(row.amount||0),0);
  $("purchaseTotal").textContent = yen(purchases);
  $("miscTotal").textContent = yen(misc);
  $("allTotal").textContent = yen(purchases+misc);
  renderList();
}
function renderList(){
  const filtered = records.filter(row=>currentFilter==="all" || row.expense_type===currentFilter);
  if(!filtered.length){
    $("expenseList").innerHTML = '<div class="empty">この月の経費データはありません。</div>';
    $("monthGrandTotal").textContent = "表示中の合計：¥0";
    return;
  }
  const groups = {};
  filtered.forEach(row=>(groups[row.expense_date] ||= []).push(row));
  let html = "";
  let visibleTotal = 0;
  Object.keys(groups).sort((a,b)=>b.localeCompare(a)).forEach(date=>{
    const dayTotal = groups[date].reduce((sum,row)=>sum+Number(row.amount||0),0);
    visibleTotal += dayTotal;
    html += `<div class="day"><h3>${escapeHtml(date.replaceAll("-","/"))}</h3>`;
    groups[date].forEach(row=>{
      const purchase = row.expense_type==="purchase";
      const quantity = Number(row.quantity||0);
      const amount = Number(row.amount||0);
      const unit = purchase && quantity>0 ? amount/quantity : null;
      html += `<article class="expense-row">
        <div class="row-top"><div class="row-name">${purchase?"📦":"🧾"} ${escapeHtml(row.description)}</div><div class="row-amount">${yen(amount)}</div></div>
        ${purchase?`<div class="details">数量：${escapeHtml(row.quantity)} / 単価：${yen(unit)}</div>`:""}
        ${row.memo?`<div class="details">メモ：${escapeHtml(row.memo)}</div>`:""}
        <span class="badge">${row.receipt_present?"☑ 領収書あり":"▢ 領収書なし"}</span>
        <div class="row-actions"><button class="btn-light" onclick="editExpense(${Number(row.id)})">編集</button><button class="btn-red" onclick="deleteExpense(${Number(row.id)})">削除</button></div>
      </article>`;
    });
    html += `<div class="day-total">この日の小計：${yen(dayTotal)}</div></div>`;
  });
  $("expenseList").innerHTML = html;
  $("monthGrandTotal").textContent = `表示中の合計：${yen(visibleTotal)}`;
}
$("expenseForm").addEventListener("submit", async event=>{
  event.preventDefault();
  setMessage("保存中...");
  const description = $("descriptionInput").value.trim();
  if(!description){setMessage("商品名・内容を入力してください。","err");return;}
  let payload;
  if(currentType==="purchase"){
    const quantity = Number($("quantityInput").value);
    const amount = Number($("amountInput").value);
    if(!(quantity>0) || $("amountInput").value==="" || !(amount>=0)){
      setMessage("数量と合計金額を正しく入力してください。","err");return;
    }
    payload = {expense_date:$("dateInput").value,expense_type:"purchase",description,quantity,unit_price:amount/quantity,amount,receipt_present:receiptPresent,memo:$("memoInput").value.trim()};
  }else{
    const amount = Number($("miscAmountInput").value);
    if($("miscAmountInput").value==="" || !(amount>=0)){
      setMessage("金額を正しく入力してください。","err");return;
    }
    payload = {expense_date:$("dateInput").value,expense_type:"misc",description,quantity:null,unit_price:null,amount,receipt_present:receiptPresent,memo:$("memoInput").value.trim()};
  }
  const wasEditing = editingId !== null;
  let result;
  if(wasEditing){
    result = await db.from("expenses").update({...payload,updated_at:new Date().toISOString()}).eq("id",editingId);
  }else{
    result = await db.from("expenses").insert(payload);
  }
  if(result.error){setMessage("保存エラー："+result.error.message,"err");return;}
  const savedDate = payload.expense_date;
  currentMonth = new Date(Number(savedDate.slice(0,4)),Number(savedDate.slice(5,7))-1,1);
  resetForm();
  await loadExpenses();
  setMessage(wasEditing ? "変更しました！" : "保存しました！","ok");
});
async function editExpense(id){
  const row = records.find(item=>Number(item.id)===Number(id));
  if(!row)return;
  editingId = row.id;
  switchType(row.expense_type);
  $("dateInput").value = row.expense_date;
  $("descriptionInput").value = row.description || "";
  $("memoInput").value = row.memo || "";
  receiptPresent = Boolean(row.receipt_present);
  $("receiptBtn").classList.toggle("yes",receiptPresent);
  $("receiptBtn").textContent = receiptPresent ? "☑ 領収書あり" : "▢ 領収書なし";
  $("receiptBtn").setAttribute("aria-pressed",String(receiptPresent));
  if(row.expense_type==="purchase"){
    $("quantityInput").value = row.quantity ?? 1;
    $("amountInput").value = row.amount ?? 0;
  }else{
    $("miscAmountInput").value = row.amount ?? 0;
  }
  $("cancelEditBtn").hidden = false;
  $("saveBtn").textContent = "変更を保存する";
  updatePurchaseCalc();
  setMessage("編集内容を入力して「変更を保存する」を押してください。");
  window.scrollTo({top:0,behavior:"smooth"});
}
async function deleteExpense(id){
  const row = records.find(item=>Number(item.id)===Number(id));
  if(!row || !confirm(`「${row.description}」を削除しますか？`))return;
  const {error} = await db.from("expenses").delete().eq("id",id);
  if(error){alert("削除エラー："+error.message);return;}
  if(editingId===id)resetForm();
  await loadExpenses();
}
$("dateInput").value = localDateString(new Date());
$("monthTitle").textContent = `${currentMonth.getFullYear()}年${currentMonth.getMonth()+1}月`;
updatePurchaseCalc();
switchType("purchase");
loadExpenses();
</script>
</body>
</html>
