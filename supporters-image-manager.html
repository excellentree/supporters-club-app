<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPPORTERS CULB 画像管理</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:16px;background:#111;color:#eee;
  font-family:Arial,sans-serif
}
main{max-width:850px;margin:auto}
section{
  background:#1d1d1d;border:1px solid #444;
  border-radius:12px;padding:16px;margin:14px 0
}
h1{font-size:23px}
h2{font-size:17px}
label{display:block;margin:12px 0 6px;color:#aaa}
input,select,textarea,button{
  font:inherit;padding:11px;border-radius:8px
}
input,select,textarea{
  width:100%;background:#111;color:#eee;border:1px solid #555
}
textarea{min-height:100px;resize:vertical}
button{
  background:#c9a96e;color:#17130b;border:0;
  font-weight:bold;cursor:pointer;margin-top:10px
}
button:disabled{opacity:.45;cursor:not-allowed}
button.secondary{background:#333;color:#eee;border:1px solid #555}
button.danger{background:#6b2929;color:white}
.note,.status{
  font-size:13px;color:#aaa;white-space:pre-wrap;
  line-height:1.6;margin-top:10px
}
.status{color:#c9a96e}
.row{display:flex;gap:8px;flex-wrap:wrap}
.gallery,.featureList{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));
  gap:10px;margin-top:12px
}
.card,.featureItem{
  border:1px solid #444;border-radius:8px;overflow:hidden;min-width:0
}
.card img,.featureItem img{
  width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#111
}
.cardBody{padding:8px;font-size:12px;overflow-wrap:anywhere}
.card a{color:#c9a96e;display:block;margin:6px 0}
.card button{width:100%;padding:8px}
.featureItem{padding:10px}
.featureItem img{aspect-ratio:4/5;border-radius:6px}
.featureItem h3{font-size:14px;overflow-wrap:anywhere}
.featureItem p{font-size:12px;color:#aaa;line-height:1.5}
.featureItem button{width:100%}
.checkboxRow{display:flex;align-items:center;gap:10px;margin-top:14px}
.checkboxRow input{width:20px;height:20px;margin:0}
.checkboxRow label{margin:0;color:#eee}
.preview{max-width:220px;margin-top:12px}
.preview img{width:100%;border-radius:8px;border:1px solid #555}
hr{border:0;border-top:1px solid #444;margin:22px 0}
@media(max-width:500px){
  body{padding:10px}
  section{padding:13px}
  .gallery,.featureList{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>

<body>
<main>

<h1>SUPPORTERS CULB</h1>
<p class="note">画像管理 / Cloudflare R2</p>

<!-- ① 接続 -->
<section>
  <h2>① 接続</h2>

  <label>画像アップロードキー（UPLOAD_SECRET）</label>
  <input id="secret" type="password" autocomplete="off"
    placeholder="Workerのアップロードキー">

  <p class="note">キーはページに保存されません。</p>

  <button id="connect">接続して読み込む</button>
  <div id="connectStatus" class="status"></div>
</section>

<!-- ② フォルダ -->
<section>
  <h2>② フォルダ</h2>

  <label>保存先フォルダ</label>
  <select id="folders" disabled>
    <option value="">接続してください</option>
  </select>

  <label>新しいフォルダ名</label>
  <input id="newFolder" placeholder="例：goalkeeper">

  <button id="makeFolder" disabled>フォルダ作成</button>
  <p class="note">英数字・ハイフン・アンダースコアのみ使用できます。</p>
  <div id="folderStatus" class="status"></div>
</section>

<!-- ③ 画像アップロード -->
<section>
  <h2>③ 画像アップロード</h2>

  <p class="note">
    先に②で保存先フォルダを選び、画像をアップロードします。
  </p>

  <input id="files" type="file"
    accept="image/jpeg,image/png,image/webp,image/gif"
    multiple disabled>

  <div id="selectedFiles" class="note"></div>

  <button id="upload" disabled>選択した画像をアップロード</button>
  <div id="uploadStatus" class="status"></div>
</section>

<!-- ④ 保存済み画像 -->
<section>
  <h2>④ 保存済み画像</h2>

  <button id="refreshImages" class="secondary" disabled>
    選択フォルダの画像を更新
  </button>

  <div id="imageListStatus" class="status"></div>
  <div id="imageGallery" class="gallery"></div>
</section>

<!-- ⑤ SUPPORTERS ROOM 特集管理 -->
<section>
  <h2>⑤ SUPPORTERS ROOM 特集管理</h2>

  <p class="note">
    特集を登録すると、SUPPORTERS ROOMの公開ページに表示できます。
    表紙画像は、特集フォルダに保存済みの画像から選びます。
  </p>

  <div class="row">
    <button id="newFeature" class="secondary" disabled>＋ 新しい特集</button>
    <button id="reloadFeatures" class="secondary" disabled>特集を再読み込み</button>
  </div>

  <div id="featureListStatus" class="status"></div>
  <div id="featureList" class="featureList"></div>

  <hr>

  <h2 id="formTitle">特集を新規登録</h2>

  <label>特集タイトル</label>
  <input id="featureTitle" placeholder="例：GOALKEEPER SPECIAL">

  <label>特集ID</label>
  <input id="featureSlug" placeholder="例：goalkeeper-special">
  <p class="note">英小文字・数字・ハイフンで入力してください。</p>

  <label>紹介文</label>
  <textarea id="featureDescription" placeholder="特集の紹介文"></textarea>

  <label>特集フォルダ</label>
  <select id="featureFolder" disabled>
    <option value="">接続してください</option>
  </select>

  <button id="searchImages" class="secondary" disabled>
    選択したフォルダの画像を探す
  </button>

  <div id="imageSearchStatus" class="status">
    フォルダを選択して画像を読み込んでください。
  </div>

  <label>表紙画像</label>
  <select id="coverSelect" disabled>
    <option value="">画像を読み込んでください</option>
  </select>

  <div id="coverPreview" class="preview"></div>

  <label>表示順</label>
  <input id="featureOrder" type="number" min="1" value="1">

  <div class="checkboxRow">
    <input id="featurePublished" type="checkbox">
    <label for="featurePublished">公開する</label>
  </div>

  <div class="row">
    <button id="saveFeature" disabled>特集を保存</button>
    <button id="cancelEdit" class="secondary">入力をリセット</button>
  </div>

  <div id="featureSaveStatus" class="status"></div>
</section>

</main>

<script>
const API =
  "https://supporters-image-api.excellentree-55.workers.dev";

const $ = id => document.getElementById(id);

let connected = false;
let features = [];
let editingSlug = null;
let foundImages = [];

// ---------- 共通 ----------

function headers(extra = {}) {
  return {
    "X-Upload-Key": $("secret").value.trim(),
    ...extra
  };
}

function showStatus(id, text) {
  $(id).textContent = text;
}

async function readJSON(response) {
  const text = await response.text();
  let data;

  try {
    data = JSON.parse(text);
  } catch {
    throw new Error(text || "サーバー応答を読み取れません");
  }

  if (!response.ok) {
    throw new Error(data.error || data.message || text);
  }

  return data;
}

function selectedFolder() {
  return $("folders").value || "";
}

function makeImageUrl(key) {
  return API + "/image/" +
    key.split("/").map(encodeURIComponent).join("/");
}

function slugify(text) {
  return text.toLowerCase()
    .normalize("NFKD")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

// ---------- 接続・フォルダ ----------

$("connect").onclick = async () => {
  if (!$("secret").value.trim()) {
    showStatus("connectStatus", "アップロードキーを入力してください");
    return;
  }

  $("connect").disabled = true;

  try {
    showStatus("connectStatus", "接続中...");

    const data = await readJSON(
      await fetch(API + "/list", {
        headers: headers()
      })
    );

    const folderList = data.folders || [];

    ["folders", "featureFolder"].forEach(id => {
      const select = $(id);
      select.innerHTML = "";

      const root = document.createElement("option");
      root.value = "";
      root.textContent = "ルートフォルダ";
      select.append(root);

      folderList.forEach(folder => {
        const option = document.createElement("option");
        option.value = folder;
        option.textContent = folder.replace(/\/$/, "");
        select.append(option);
      });
    });

    [
      "folders", "featureFolder", "makeFolder",
      "files", "upload", "refreshImages",
      "searchImages", "saveFeature",
      "newFeature", "reloadFeatures"
    ].forEach(id => {
      $(id).disabled = false;
    });

    connected = true;

    await loadImages();
    await loadFeatures();

    showStatus("connectStatus", "接続成功！");
  } catch (error) {
    showStatus("connectStatus", "接続失敗：" + error.message);
  } finally {
    $("connect").disabled = false;
  }
};

$("makeFolder").onclick = async () => {
  const name = $("newFolder").value.trim();

  if (!/^[A-Za-z0-9_-]+$/.test(name)) {
    showStatus(
      "folderStatus",
      "英数字・ハイフン・アンダースコアで入力してください"
    );
    return;
  }

  try {
    const data = await readJSON(
      await fetch(API + "/folder", {
        method: "POST",
        headers: headers({
          "Content-Type": "application/json"
        }),
        body: JSON.stringify({ name })
      })
    );

    $("newFolder").value = "";

    $("connect").click();

    showStatus("folderStatus", "フォルダを作成しました：" + data.folder);
  } catch (error) {
    showStatus("folderStatus", "作成失敗：" + error.message);
  }
};

$("folders").onchange = loadImages;
$("refreshImages").onclick = loadImages;

// ---------- 画像一覧 ----------

async function loadImages() {
  if (!connected) return;

  $("imageGallery").innerHTML = "";
  showStatus("imageListStatus", "画像を読み込み中...");

  try {
    const data = await readJSON(
      await fetch(
        API + "/list?prefix=" + encodeURIComponent(selectedFolder()),
        { headers: headers() }
      )
    );

    (data.objects || []).forEach(object => {
      const card = document.createElement("article");
      card.className = "card";

      const img = document.createElement("img");
      img.src = object.url || makeImageUrl(object.key);
      img.alt = object.key;
      img.loading = "lazy";

      const body = document.createElement("div");
      body.className = "cardBody";
      body.textContent = object.key.split("/").pop();

      const link = document.createElement("a");
      link.href = object.url || makeImageUrl(object.key);
      link.target = "_blank";
      link.rel = "noopener";
      link.textContent = "画像を開く";

      const copy = document.createElement("button");
      copy.textContent = "URLをコピー";

      copy.onclick = async () => {
        const url = object.url || makeImageUrl(object.key);

        try {
          await navigator.clipboard.writeText(url);
          copy.textContent = "コピーしました";
        } catch {
          prompt("画像URL", url);
        }
      };

      body.append(link, copy);
      card.append(img, body);
      $("imageGallery").append(card);
    });

    showStatus(
      "imageListStatus",
      `${(data.objects || []).length}枚の画像`
    );
  } catch (error) {
    showStatus("imageListStatus", "画像取得失敗：" + error.message);
  }
}

// ---------- アップロード ----------

$("files").onchange = () => {
  const count = $("files").files.length;
  showStatus("selectedFiles", count ? `${count}枚選択中` : "");
};

$("upload").onclick = async () => {
  const files = [...$("files").files];

  if (!files.length) {
    showStatus("uploadStatus", "画像を選択してください");
    return;
  }

  let success = 0;
  const errors = [];

  $("upload").disabled = true;

  for (let i = 0; i < files.length; i++) {
    const file = files[i];

    const extension = {
      "image/jpeg": "jpg",
      "image/png": "png",
      "image/webp": "webp",
      "image/gif": "gif"
    }[file.type];

    if (!extension || file.size > 10 * 1024 * 1024) {
      errors.push(file.name + "：形式またはサイズが不適切");
      continue;
    }

    const safeName = file.name
      .replace(/\.[^.]+$/, "")
      .normalize("NFKD")
      .replace(/[^A-Za-z0-9_-]+/g, "-")
      .slice(0, 45) || "image";

    const key =
      selectedFolder() +
      Date.now() + "-" +
      crypto.randomUUID() + "-" +
      safeName + "." + extension;

    showStatus(
      "uploadStatus",
      `アップロード中 ${i + 1}/${files.length}：${file.name}`
    );

    try {
      await readJSON(
        await fetch(API + "/upload", {
          method: "POST",
          headers: headers({
            "Content-Type": file.type,
            "X-Image-Key": key
          }),
          body: file
        })
      );

      success++;
    } catch (error) {
      errors.push(file.name + "：" + error.message);
    }
  }

  $("files").value = "";
  showStatus("selectedFiles", "");
  $("upload").disabled = false;

  await loadImages();

  showStatus(
    "uploadStatus",
    `${success}/${files.length}枚アップロード成功` +
    (errors.length ? "\n" + errors.join("\n") : "")
  );
};

// ---------- 特集読み込み ----------

async function loadFeatures() {
  showStatus("featureListStatus", "特集を読み込み中...");

  try {
    const data = await readJSON(
      await fetch(API + "/admin-features", {
        headers: headers()
      })
    );

    features = data.features || [];
    renderFeatureList();

    showStatus(
      "featureListStatus",
      `${features.length}件の特集`
    );
  } catch (error) {
    showStatus(
      "featureListStatus",
      "特集読み込み失敗：" + error.message
    );
  }
}

function renderFeatureList() {
  const list = $("featureList");
  list.innerHTML = "";

  if (!features.length) {
    list.textContent = "特集はまだ登録されていません。";
    return;
  }

  [...features]
    .sort((a, b) => Number(a.order || 0) - Number(b.order || 0))
    .forEach(feature => {
      const item = document.createElement("article");
      item.className = "featureItem";

      const img = document.createElement("img");
      img.src = feature.coverUrl || makeImageUrl(feature.coverKey);
      img.alt = feature.title;

      const title = document.createElement("h3");
      title.textContent = feature.title;

      const desc = document.createElement("p");
      desc.textContent = feature.description || "";

      const state = document.createElement("p");
      state.textContent =
        (feature.published ? "公開中" : "非公開") +
        " / 表示順 " + (feature.order || 1);

      const edit = document.createElement("button");
      edit.className = "secondary";
      edit.textContent = "編集";
      edit.onclick = () => editFeature(feature.slug);

      const remove = document.createElement("button");
      remove.className = "danger";
      remove.textContent = "削除";

      remove.onclick = async () => {
        if (!confirm("この特集を削除しますか？")) return;

        features = features.filter(f => f.slug !== feature.slug);
        await saveFeatureList();
      };

      item.append(img, title, desc, state, edit, remove);
      list.append(item);
    });
}

// ---------- 特集フォーム ----------

function resetForm() {
  editingSlug = null;

  $("formTitle").textContent = "特集を新規登録";
  $("featureTitle").value = "";
  $("featureSlug").value = "";
  $("featureDescription").value = "";
  $("featureOrder").value = "1";
  $("featurePublished").checked = false;

  $("coverSelect").innerHTML =
    '<option value="">画像を読み込んでください</option>';
  $("coverSelect").disabled = true;
  $("coverPreview").innerHTML = "";

  foundImages = [];

  showStatus("imageSearchStatus", "特集フォルダを選択してください");
  showStatus("featureSaveStatus", "");
}

$("newFeature").onclick = () => {
  resetForm();
};

$("cancelEdit").onclick = resetForm;
$("reloadFeatures").onclick = loadFeatures;

$("featureTitle").oninput = () => {
  if (!editingSlug) {
    $("featureSlug").value = slugify($("featureTitle").value);
  }
};

// ---------- 特集画像を探す ----------

$("searchImages").onclick = loadFeatureImages;

$("featureFolder").onchange = () => {
  foundImages = [];
  $("coverSelect").innerHTML =
    '<option value="">画像を読み込んでください</option>';
  $("coverSelect").disabled = true;
  $("coverPreview").innerHTML = "";
};

async function loadFeatureImages(selectedKey = "") {
  const folder = $("featureFolder").value;

  showStatus("imageSearchStatus", "フォルダ内の画像を探しています...");

  try {
    const data = await readJSON(
      await fetch(
        API + "/list?prefix=" + encodeURIComponent(folder),
        { headers: headers() }
      )
    );

    foundImages = (data.objects || []).filter(object =>
      /\.(jpg|jpeg|png|webp|gif)$/i.test(object.key)
    );

    const select = $("coverSelect");
    select.innerHTML = "";

    if (!foundImages.length) {
      select.disabled = true;
      select.innerHTML =
        '<option value="">画像がありません</option>';

      showStatus(
        "imageSearchStatus",
        "画像が見つかりません。③で先に画像をアップロードしてください。"
      );
      return;
    }

    const first = document.createElement("option");
    first.value = "";
    first.textContent = "表紙にする画像を選択";
    select.append(first);

    foundImages.forEach(image => {
      const option = document.createElement("option");
      option.value = image.key;
      option.textContent = image.key.split("/").pop();
      select.append(option);
    });

    select.disabled = false;

    if (selectedKey) {
      select.value = selectedKey;
      showCover(selectedKey);
    }

    showStatus(
      "imageSearchStatus",
      `${foundImages.length}枚見つかりました。表紙画像を選んでください。`
    );
  } catch (error) {
    showStatus(
      "imageSearchStatus",
      "画像検索失敗：" + error.message
    );
  }
}

$("coverSelect").onchange = () => {
  showCover($("coverSelect").value);
};

function showCover(key) {
  $("coverPreview").innerHTML = "";

  if (!key) return;

  const image = foundImages.find(item => item.key === key);
  if (!image) return;

  const img = document.createElement("img");
  img.src = image.url || makeImageUrl(image.key);
  img.alt = "表紙画像プレビュー";

  $("coverPreview").append(img);
}

// ---------- 特集編集 ----------

async function editFeature(slug) {
  const feature = features.find(f => f.slug === slug);
  if (!feature) return;

  editingSlug = slug;

  $("formTitle").textContent = "特集を編集";
  $("featureTitle").value = feature.title || "";
  $("featureSlug").value = feature.slug || "";
  $("featureDescription").value = feature.description || "";
  $("featureFolder").value = feature.folder || "";
  $("featureOrder").value = feature.order || 1;
  $("featurePublished").checked = !!feature.published;

  await loadFeatureImages(feature.coverKey);

  $("formTitle").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

// ---------- 特集保存 ----------

$("saveFeature").onclick = async () => {
  const title = $("featureTitle").value.trim();
  const slug = $("featureSlug").value.trim();
  const description = $("featureDescription").value.trim();
  const folder = $("featureFolder").value;
  const coverKey = $("coverSelect").value;
  const order = Number($("featureOrder").value || 1);
  const published = $("featurePublished").checked;

  if (!title) {
    showStatus("featureSaveStatus", "タイトルを入力してください");
    return;
  }

  if (!/^[a-z0-9-]+$/.test(slug)) {
    showStatus("featureSaveStatus", "特集IDの形式が正しくありません");
    return;
  }

  if (!folder) {
    showStatus("featureSaveStatus", "特集フォルダを選択してください");
    return;
  }

  if (!coverKey) {
    showStatus("featureSaveStatus", "表紙画像を選択してください");
    return;
  }

  if (features.some(f => f.slug === slug && f.slug !== editingSlug)) {
    showStatus("featureSaveStatus", "この特集IDはすでに使われています");
    return;
  }

  const feature = {
    slug,
    title,
    description,
    folder,
    coverKey,
    published,
    order
  };

  const next = editingSlug
    ? features.map(f => f.slug === editingSlug ? feature : f)
    : [...features, feature];

  $("saveFeature").disabled = true;
  showStatus("featureSaveStatus", "保存中...");

  try {
    const data = await readJSON(
      await fetch(API + "/admin-features", {
        method: "POST",
        headers: headers({
          "Content-Type": "application/json"
        }),
        body: JSON.stringify({ features: next })
      })
    );

    features = data.features || next;
    renderFeatureList();

    showStatus("featureSaveStatus", "特集を保存しました！");
    resetForm();
  } catch (error) {
    showStatus("featureSaveStatus", "保存失敗：" + error.message);
  } finally {
    $("saveFeature").disabled = false;
  }
};

async function saveFeatureList() {
  try {
    const data = await readJSON(
      await fetch(API + "/admin-features", {
        method: "POST",
        headers: headers({
          "Content-Type": "application/json"
        }),
        body: JSON.stringify({ features })
      })
    );

    features = data.features || features;
    renderFeatureList();

    showStatus("featureListStatus", "特集データを更新しました");
  } catch (error) {
    showStatus("featureListStatus", "保存失敗：" + error.message);
    await loadFeatures();
  }
}
</script>
</body>
</html>
