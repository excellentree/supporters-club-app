<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SUPPORTERS CULB 月間売上</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:24px 18px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
}

.subtitle{
  margin-top:5px;
  font-size:13px;
  color:#aaa;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:20px 15px 50px;
}

.date-area{
  margin-bottom:18px;
}

.date-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:10px;
}

.date-input{
  padding:10px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.summary-label{
  font-size:13px;
  color:#777;
  margin-bottom:8px;
}

.summary-value{
  font-size:25px;
  font-weight:800;
}

.section{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,
td{
  padding:10px 8px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:top;
}

td:nth-child(2){
  white-space:nowrap;
}

th{
  font-weight:800;
  white-space:nowrap;
}

.empty{
  text-align:center;
  color:#999;
  padding:35px 10px;
  font-size:14px;
}

.menu{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.menu-button{
  border:none;
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:16px 10px;
  font-size:14px;
  font-weight:700;
}

@media(max-width:700px){
  .summary{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">SUPPORTERS CULB</div>
    <div class="subtitle">SALES MANAGEMENT</div>
  </div>
</header>

<div class="container">

  <div class="date-area">
    <div class="date-title">月間売上明細</div>

    <input
      type="month"
      id="salesMonth"
      class="date-input"
    >
  </div>
  </div>

  <div class="section">

    <div class="section-title">
      月間売上明細
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>日付</th>
            <th>商品名</th>
            <th>売上</th>
            <th>数量</th>
            <th>仕入</th>
            <th>粗利益</th>
          </tr>
        </thead>

        <tbody id="monthlySalesTable">
        </tbody>

      </table>

      <div id="monthlyEmptyMessage" class="empty">
        今月の売上データがありません
      </div>

    </div>

  </div>

  <div class="menu">

    <button
      class="menu-button"
      onclick="location.href='sales.html'">
      月間売上トップへ
    </button>

    <button
      class="menu-button"
      onclick="location.href='daily.html'">
      日計表へ戻る
    </button>

  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://juzrxqrabrvhlwvnvton.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const today = new Date();

const yyyy =
  today.getFullYear();

const mm =
  String(today.getMonth() + 1)
    .padStart(2,"0");

document.getElementById("salesMonth").value =
  `${yyyy}-${mm}`;


async function loadMonthlySales(){

  const month =
    document.getElementById("salesMonth").value;

  if(!month) return;

  const [year, monthNumber] =
    month.split("-").map(Number);

  const startDate =
    `${year}-${String(monthNumber).padStart(2,"0")}-01`;

  const nextMonthDate =
    new Date(year, monthNumber, 1);

  const nextYear =
    nextMonthDate.getFullYear();

  const nextMonth =
    String(nextMonthDate.getMonth() + 1)
      .padStart(2,"0");

  const endDate =
    `${nextYear}-${nextMonth}-01`;


  const { data, error } =
    await db
      .from("sales")
      .select("*")
      .gte("sale_date", startDate)
      .lt("sale_date", endDate)
      .order("sale_date", {
        ascending:true
      });


  if(error){

    console.error(
      "Supabase月間明細読み込みエラー:",
      error
    );

    return;
  }


  const monthlyTable =
    document.getElementById(
      "monthlySalesTable"
    );

  const monthlyEmpty =
    document.getElementById(
      "monthlyEmptyMessage"
    );


  monthlyTable.innerHTML = "";


  (data || []).forEach(sale => {

    const saleTotal =
      Number(sale.price || 0) *
      Number(sale.quantity || 1);

    const costTotal =
      Number(sale.cost || 0) *
      Number(sale.quantity || 1);

    const shippingTotal =
      Number(sale.shipping || 0) *
      Number(sale.quantity || 1);

    const mercariFee =
      saleTotal * 0.10;

    const profit =
      saleTotal -
      costTotal -
      shippingTotal -
      mercariFee;


    const dateParts =
      String(sale.sale_date || "")
        .split("-");

    const displayDate =
      dateParts.length === 3
        ? `${Number(dateParts[1])}/${Number(dateParts[2])}`
        : sale.sale_date;


    const tr =
      document.createElement("tr");


    tr.innerHTML = `

      <td>
        ${displayDate}
      </td>

     <td>
          ${
            sale.is_set &&
          Array.isArray(sale.set_items)

            ? sale.set_items.map(item => `
               <div style="margin:8px 0;display:block;white-space:nowrap;">
                  ${item.category || ""}
                  / ${item.productName || ""} /

                  ${item.base || ""}
                  / ${item.version || ""}
                  / ${item.model || ""}
                  ×${item.quantity || 1}
                </div>
              `).join("")

            : `
              ${sale.category || ""}
             /${sale.product_name || ""} /

              ${sale.base || ""}
              / ${sale.version || ""}
              / ${sale.model || ""}
            `
        }
      </td>

      <td>
        ¥${saleTotal.toLocaleString()}
      </td>

      <td>
        ${
          sale.is_set &&
          Array.isArray(sale.set_items)
            ? sale.set_items.length
            : Number(sale.quantity || 1)
        }
      </td>

      <td>
        ¥${costTotal.toLocaleString()}
      </td>

      <td>
        ¥${profit.toLocaleString()}
      </td>

    `;

    monthlyTable.appendChild(tr);

  });


  monthlyEmpty.style.display =
    (data || []).length === 0
      ? "block"
      : "none";

}


loadMonthlySales();


document
  .getElementById("salesMonth")
  .addEventListener(
    "change",
    loadMonthlySales
  );

</script>
</body>
</html>
