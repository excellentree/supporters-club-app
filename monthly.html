<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SUPPORTERS CULB 月間売上</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:24px 18px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
}

.subtitle{
  margin-top:5px;
  font-size:13px;
  color:#aaa;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:20px 15px 50px;
}

.date-area{
  margin-bottom:18px;
}

.date-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:10px;
}

.date-input{
  padding:10px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.summary-label{
  font-size:13px;
  color:#777;
  margin-bottom:8px;
}

.summary-value{
  font-size:25px;
  font-weight:800;
}

.section{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,
td{
  padding:10px 8px;
  border-bottom:1px solid #eee;
  text-align:left;
  vertical-align:top;
}

th{
  font-weight:800;
  white-space:nowrap;
}

.empty{
  text-align:center;
  color:#999;
  padding:35px 10px;
  font-size:14px;
}

.menu{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.menu-button{
  border:none;
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:16px 10px;
  font-size:14px;
  font-weight:700;
}

@media(max-width:700px){
  .summary{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">SUPPORTERS CULB</div>
    <div class="subtitle">SALES MANAGEMENT</div>
  </div>
</header>

<div class="container">

  <div class="date-area">
    <div class="date-title">月間売上明細</div>

    <input
      type="month"
      id="salesMonth"
      class="date-input"
    >
  </div>
  </div>

  <div class="section">

    <div class="section-title">
      月間売上明細
    </div>

    <div class="table-wrap">

      <table>

        <thead>
          <tr>
            <th>日付</th>
            <th>商品名</th>
            <th>売上</th>
            <th>数量</th>
            <th>仕入</th>
            <th>粗利益</th>
          </tr>
        </thead>

        <tbody id="monthlySalesTable">
        </tbody>

      </table>

      <div id="monthlyEmptyMessage" class="empty">
        今月の売上データがありません
      </div>

    </div>

  </div>

  <div class="menu">

    <button
      class="menu-button"
      onclick="location.href='sales.html'">
      月間売上トップへ
    </button>

    <button
      class="menu-button"
      onclick="location.href='daily.html'">
      日計表へ戻る
    </button>

  </div>

</div>

</body>
</html>
