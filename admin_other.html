<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SUPPORTERS CULB その他商品登録</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:16px;
  text-align:center;
}

.container{
  max-width:600px;
  margin:20px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}

h2{
  margin-top:0;
}

button{
  border:none;
  border-radius:8px;
  padding:12px 16px;
  font-size:15px;
  cursor:pointer;
  background:#eee;
}
  #productInfo{
  margin-top:30px;
}

#productInfo label{
  display:block;
  margin-top:15px;
  margin-bottom:6px;
  font-weight:bold;
}

#productInfo input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}
  .category-button.selected{
  background:#111;
  color:#fff;
}

button:hover{
  opacity:.8;
}
</style>
</head>

<body>

<header>
  <h1>SUPPORTERS CULB</h1>
  <div>その他商品登録</div>
</header>

<div class="container">

  <div class="card">
    <h2>商品登録</h2>
<div id="categoryArea">

  <h3>カテゴリー</h3>

  <div>
<button type="button" class="category-button" onclick="selectCategory(this)">LEGO</button>
<button type="button" class="category-button" onclick="selectCategory(this)">アパレル</button>
<button type="button" class="category-button" onclick="selectCategory(this)">キーホルダー</button>
<button type="button" class="category-button" onclick="selectCategory(this)">ステッカー</button>
  </div>

  <div style="margin-top:10px;">
    <button type="button" class="category-button" onclick="selectCategory(this)">フィギュア</button>
<button type="button" class="category-button" onclick="selectCategory(this)">ペナント</button>
<button type="button" class="category-button" onclick="selectCategory(this)">ピンバッジ</button>
<button type="button" class="category-button" onclick="selectCategory(this)">その他</button>

</div>
  </div>

</div>
  <div id="productInfo">

  <h3>商品情報</h3>

  <label>画像</label>
  <input type="file" id="imageInput" accept="image/*">

  <label>品名</label>
  <input type="text" id="nameInput">

  <label>VERSION</label>
  <input type="text" id="versionInput">

  <label>MODEL</label>
  <input type="text" id="modelInput">

  <label>国 or クラブ</label>
  <input type="text" id="countryClubInput">

  <label>販売価格</label>
  <input type="number" id="priceInput">

  <label>平均原価</label>
  <input type="number" id="averageCostInput">

  <label>在庫</label>
  <input type="number" id="stockInput" value="0">
<br><br>

<button type="button" id="registerButton">
  商品を登録する
</button>
</div>
  <div class="card">
  <h2>登録済み商品</h2>
  <div id="productList"></div>
</div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://juzrxqrabrvhlwvnvton.supabase.co";

const SUPABASE_KEY =
"sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";
  
const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  let uploadedImageUrl = "";

document.getElementById("imageInput").addEventListener("change", async function(){
  const file = this.files[0];

  if(!file) return;

  const fileName = Date.now() + "-" + file.name;

  const { data, error } = await sb
    .storage
    .from("product-images")
    .upload(fileName, file);

  if(error){
    console.error(error);
    alert("画像のアップロードに失敗しました");
    return;
  }

  const { data: publicData } = sb
    .storage
    .from("product-images")
    .getPublicUrl(fileName);

  uploadedImageUrl = publicData.publicUrl;

  alert("画像をアップロードしました！");
});
  document.getElementById("registerButton").addEventListener("click", async function(){

  const selectedButton = document.querySelector(".category-button.selected");

  if(!selectedButton){
    alert("カテゴリーを選択してください");
    return;
  }

  if(!uploadedImageUrl){
    alert("画像をアップロードしてください");
    return;
  }

  const name = document.getElementById("nameInput").value.trim();
  const version = document.getElementById("versionInput").value.trim();
  const model = document.getElementById("modelInput").value.trim();
  const countryClub = document.getElementById("countryClubInput").value.trim();
  const price = document.getElementById("priceInput").value;
  const averageCost = document.getElementById("averageCostInput").value;
  const stock = document.getElementById("stockInput").value;

  if(!name){
    alert("品名を入力してください");
    return;
  }

  if(!price){
    alert("販売価格を入力してください");
    return;
  }

  const { error } = await sb
    .from("products")
    .insert([{
      image_url: uploadedImageUrl,
      name: name,
      version: version,
      model: model,
      base: null,
      price: Number(price),
      average_cost: Number(averageCost) || 0,
      stock: Number(stock) || 0,
      category: selectedButton.textContent.trim(),
      item_type: "その他",
      is_new: false,
      region: null,
      country_or_club: countryClub
    }]);

  if(error){
    console.error(error);
    alert("商品の登録に失敗しました");
    return;
  }

  alert("商品を登録しました！");

});
async function loadOtherProducts(){

  const { data, error } = await sb
    .from("products")
    .select("*")
    .neq("category", "soccerwe")
    .order("created_at", { ascending:false });

  if(error){
    console.error(error);
    return;
  }

  const list = document.getElementById("productList");

  list.innerHTML = "";

  data.forEach(product => {

    const div = document.createElement("div");

    div.style.border = "1px solid #ddd";
    div.style.borderRadius = "10px";
    div.style.padding = "12px";
    div.style.marginTop = "12px";

    div.innerHTML = `
      <img src="${product.image_url}" style="width:100%;max-width:200px;border-radius:8px;">
      <div style="font-weight:bold;margin-top:8px;">
        ${product.name || ""}
      </div>
      <div>VERSION：${product.version || ""}</div>
      <div>MODEL：${product.model || ""}</div>
      <div>国 or クラブ：${product.country_or_club || ""}</div>
      <div>販売価格：${product.price || 0}円</div>
      <div>平均原価：${product.average_cost || 0}円</div>
      <div>在庫：${product.stock || 0}</div>
      <div>カテゴリー：${product.category || ""}</div>
    `;

    list.appendChild(div);

  });
}

loadOtherProducts();
  
  </script> 
<script>
function selectCategory(button){

  document.querySelectorAll(".category-button").forEach(btn=>{
    btn.classList.remove("selected");
  });

  button.classList.add("selected");
}
</script>
</body>
</html>
