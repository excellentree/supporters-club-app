function getSales(){

  return JSON.parse(
    localStorage.getItem(getStorageKey()) || "[]"
  );

}


function saveSales(data){

  localStorage.setItem(
    getStorageKey(),
    JSON.stringify(data)
  );

}


function addSale(){

  const productName =
    document.getElementById("productName").value.trim();
const model =
  document.getElementById("modelSelect").value;
  const price =
    Number(document.getElementById("price").value);

  const cost =
    Number(document.getElementById("cost").value);
const shipping =

  Number(document.getElementById("shipping").value);
  const quantity =
  Number(document.getElementById("saleQuantity").value);
  const orderNo =
    document.getElementById("orderNo").value.trim();


  if(!productName){

    alert("商品名を入力してください");

    return;

  }


  if(!price || price <= 0){

    alert("販売価格を入力してください");

    return;

  }

    return;

  }


  const sales = getSales();


  sales.push({

    productName:productName,
    base:selectedProduct ? selectedProduct.base : "",
　　　version:selectedProduct ? selectedProduct.version : "",
　　 model:model,
　  productId:selectedProduct ? selectedProduct.id : null,

    region:selectedProduct ? selectedProduct.region : null,
    countryOrClub:selectedProduct ? selectedProduct.country_or_club : null,
    price:price,
    cost:cost,
　　shipping:shipping,
    quantity:quantity,

    orderNo:orderNo

  });


  saveSales(sales);

  document.getElementById("productName").value = "";

  document.getElementById("price").value = "";

  document.getElementById("cost").value = "";

  document.getElementById("quantity").value = "1";

  document.getElementById("orderNo").value = "";


  render();

}

function addSetSale(){

  const productName =
    document.getElementById("productName").value.trim();

  const model =
    document.getElementById("modelSelect").value;

  const price =
    Number(document.getElementById("price").value);

  const cost =
    Number(document.getElementById("cost").value);

  const shipping =
    Number(document.getElementById("shipping").value);

  const orderNo =
    document.getElementById("orderNo").value.trim();

  const setQuantity =
    Number(document.getElementById("quantity").value);
　const saleQuantity =
    Number(document.getElementById("saleQuantity").value);

  if(!productName){

    alert("商品名を入力してください");

    return;

  }


  if(!price || price <= 0){

    alert("販売価格を入力してください");

    return;

  }


  if(setQuantity < 2){

    alert("セット点数を2以上にしてください");

    return;

  }


  /*
    今回登録する選手をセットの中に保存
  */

  setItems.push({

    productName: productName,

    base: selectedProduct
      ? selectedProduct.base
      : "",

    version: selectedProduct
      ? selectedProduct.version
      : "",

    model: model,

    productId: selectedProduct
      ? selectedProduct.id
      : null,

    category: selectedProduct
      ? selectedProduct.category
      : "",

    itemType: selectedProduct
      ? selectedProduct.item_type
      : "",

    region: selectedProduct
      ? selectedProduct.region
      : "",

    countryOrClub: selectedProduct
      ? selectedProduct.country_or_club
      : "",

    price: price,

    cost: cost,

    shipping: shipping,

    quantity: 1,

    orderNo: orderNo

  });


  /*
    まだセットの途中
  */

  if(setItems.length < setQuantity){

    document.getElementById("productName").value = "";
    document.getElementById("price").value = "";
    document.getElementById("cost").value = "";

    selectedProduct = null;

    render();

    alert(
      `セット ${setItems.length}/${setQuantity}点目を登録しました`
    );

    return;

  }


  /*
    ここで3人分を1つのセットにまとめる
  */

  const sales = getSales();


  const totalPrice =
    setItems.reduce(
      (sum, item) => sum + Number(item.price || 0),
      0
    );


  const totalCost =
    setItems.reduce(
      (sum, item) => sum + Number(item.cost || 0),
      0
    );


  const totalShipping =
    Number(shipping || 0);


  const setSale = {

    isSet: true,

    productName:
      setItems
        .map(item => item.productName)
        .join(" / "),

    model: "",

    base: "",

    version: "",

    productId: null,

    category:
      setItems[0].category || "",

    itemType:
      setItems[0].itemType || "",

    region:
      setItems[0].region || "",

    countryOrClub:
      setItems[0].countryOrClub || "",

    price: totalPrice,

    cost: totalCost,

    shipping: totalShipping,

    quantity: saleQuantity,

    orderNo: orderNo,

    setItems: [...setItems]

  };


  sales.push(setSale);


  saveSales(sales);


  /*
    セット登録完了
  */

  setItems = [];

  selectedProduct = null;

  document.getElementById("productName").value = "";

  document.getElementById("price").value = "";

  document.getElementById("cost").value = "";

  document.getElementById("quantity").value = "1";

  document.getElementById("quantityDisplay").textContent = "1";

  document.getElementById("orderNo").value = "";


  render();


  alert("セット販売を登録しました！");

}
  function updateSetItemPrice(saleIndex, itemIndex, value){

  const sales = getSales();

  const sale = sales[saleIndex];

  if(!sale || !sale.isSet || !Array.isArray(sale.setItems)){
    return;
  }

  const newPrice = Number(value);

  if(!newPrice || newPrice < 0){
    alert("金額を入力してください");
    render();
    return;
  }

  sale.setItems[itemIndex].price = newPrice;

  sale.price =
    sale.setItems.reduce(
      (sum, item) => sum + Number(item.price || 0),
      0
    );
    delete sale.profitOverride;

  saveSales(sales);

  render();
}
  function updateSetTotalPrice(saleIndex, value){

  const sales = getSales();

  const sale = sales[saleIndex];

  if(!sale || !sale.isSet){
    return;
  }

  const newPrice = Number(value);

  if(!newPrice || newPrice < 0){
    alert("金額を入力してください");
    render();
    return;
  }

  sale.price = newPrice;

  delete sale.profitOverride;

  saveSales(sales);

  render();

}
  function updateSetProfit(saleIndex, value){

  const sales = getSales();

  const sale = sales[saleIndex];

  if(!sale || !sale.isSet){
    return;
  }

  const newProfit = Number(value);

  if(isNaN(newProfit) || newProfit < 0){
    alert("粗利を入力してください");
    render();
    return;
  }

  sale.profitOverride = newProfit;

  saveSales(sales);

  render();

}
function deleteSale(index){

  const sales = getSales();

  sales.splice(index,1);

  saveSales(sales);

  render();

}


function render(){

  const sales = getSales();

  const table = document.getElementById("salesTable");

  const empty = document.getElementById("emptyMessage");


  table.innerHTML = "";


  let totalSales = 0;

  let totalQty = 0;

  let totalProfit = 0;


  sales.forEach((sale,index)=>{

    const saleTotal =
      sale.price * sale.quantity;

    const costTotal =
      sale.cost * sale.quantity;

    const shippingTotal =

  sale.shipping * sale.quantity;
const mercariFee =
  saleTotal * 0.10;
const profit =

  saleTotal - costTotal - shippingTotal - mercariFee;

    totalSales += saleTotal;

    totalQty += sale.quantity;

    totalProfit += profit;


    const tr = document.createElement("tr");


   tr.innerHTML = `
<td>No.${index + 1}</td>
<td>
  ${
    sale.isSet && Array.isArray(sale.setItems)
      ? `
        <div>
          ${sale.setItems.map((item) => `
            <div style="margin:8px 0;font-size:14px;">
              ${escapeHtml(item.category || "")} / ${escapeHtml(item.productName || "")}<br>
              ${escapeHtml(item.base || "")} / ${escapeHtml(item.version || "")} / ${escapeHtml(item.model || "")}
            </div>
          `).join("")}
        </div>
      `
      : `
        ${escapeHtml(sale.category || "")} / ${escapeHtml(sale.productName || "")}<br>
        ${escapeHtml(sale.base || "")} / ${escapeHtml(sale.version || "")} / ${escapeHtml(sale.model || "")}
      `
  }
</td>

<td>
  ${
    sale.isSet
      ? `
        <input
          type="number"
          value="${Number(sale.price || 0)}"
          style="width:120px;padding:8px;border:1px solid #ddd;border-radius:8px;text-align:right;font-size:16px;"
          onchange="updateSetTotalPrice(${index}, this.value)"
        >
      `
      : `¥${saleTotal.toLocaleString()}`
  }
</td>

  <td>${sale.setQuantity || sale.quantity}</td>

  <td>¥${costTotal.toLocaleString()}</td>

  <td>
  ${
    sale.isSet
      ? `
        <input
          type="number"
          value="${Number(sale.profitOverride ?? profit)}"
          style="width:120px;padding:6px 8px;border:1px solid #ddd;border-radius:10px;"
          onchange="updateSetProfit(${index}, this.value)"
        >
      `
      : `¥${profit.toLocaleString()}`
  }
</td>

  <td>
    <button class="delete"
      onclick="deleteSale(${index})">
      削除
    </button>
  </td>

`;


    table.appendChild(tr);

  });


  document.getElementById("totalSales").textContent =
    "¥" + totalSales.toLocaleString();

  document.getElementById("totalQty").textContent =
    totalQty.toLocaleString();

  document.getElementById("totalOrders").textContent =
    sales.length.toLocaleString();

  document.getElementById("totalProfit").textContent =
    "¥" + totalProfit.toLocaleString();


  empty.style.display =
    sales.length === 0 ? "block" : "none";

}


function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


salesDate.addEventListener("change",render);


render();

</script>

</body>
</html>
