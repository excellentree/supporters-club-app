table{

th:nth-child(n+3),

function getSales(){

  return JSON.parse(
    localStorage.getItem(getStorageKey()) || "[]"
  );

}


async function saveSales(data){

  // いままで通りローカルにも保存
  localStorage.setItem(
    getStorageKey(),
    JSON.stringify(data)
  );

  // Supabaseにも保存
  const rows = data.map(sale => ({
    sale_date: salesDate.value,
    order_no: sale.orderNo || "",
    is_set: !!sale.isSet,
    product_name: sale.productName || "",
    model: sale.model || "",
    base: sale.base || "",
    version: sale.version || "",
    product_id: sale.productId || null,
    category: sale.category || "",
    item_type: sale.itemType || "",
    region: sale.region || "",
    country_or_club: sale.countryOrClub || "",
    original_total_price: Number(sale.originalTotalPrice || sale.price || 0),
    price: Number(sale.price || 0),
    discount: Number(sale.discount || 0),
    cost: Number(sale.cost || 0),
    shipping: Number(sale.shipping || 0),
    quantity: Number(sale.quantity || 1),
    set_items: sale.setItems || []
  }));

  // その日のデータを一度削除
  const { error: deleteError } =
    await db
      .from("sales")
      .delete()
      .eq("sale_date", salesDate.value);

  if(deleteError){
    console.error(deleteError);
    alert("Supabaseへの保存に失敗しました\n" + deleteError.message);
    return;
  }

  // その日の最新データを保存
  if(rows.length > 0){

    const { error: insertError } =
      await db
        .from("sales")
        .insert(rows);

    if(insertError){
      console.error(insertError);
      alert("Supabaseへの保存に失敗しました\n" + insertError.message);
      return;
    }
  }

}

  if(setItems.length < setQuantity){

    document.getElementById("productName").value = "";
    document.getElementById("price").value = "";
    document.getElementById("cost").value = "";

    selectedProduct = null;
document.getElementById("setItemQuantity").value = "1";
document.getElementById("setItemQuantityDisplay").textContent = "1";
    render();

    alert(
      `セット ${setItems.length}/${setQuantity}点目を登録しました`
    );

    return;

  }


  /*
    ここで3人分を1つのセットにまとめる
  */

  const sales = getSales();


  const totalPrice =
    setItems.reduce(
      (sum, item) => sum + Number(item.price || 0),
      0
    );


  const totalCost =
    setItems.reduce(
      (sum, item) => sum + Number(item.cost || 0),
      0
    );


  const totalShipping =
    Number(shipping || 0);


  const setSale = {

    isSet: true,

    productName:
      setItems
        .map(item => item.productName)
        .join(" / "),

    model: "",

    base: "",

    version: "",

    productId: null,

    category:
      setItems[0].category || "",

    itemType:
      setItems[0].itemType || "",

    region:
      setItems[0].region || "",

    countryOrClub:
      setItems[0].countryOrClub || "",
　　originalTotalPrice: totalPrice,
    price:totalPrice -　Math.max(0, (setItems.length - 1) * 100),
　　discount:
  Math.max(0, (setItems.length - 1) * 100),
    cost: totalCost,

    shipping: totalShipping,

    quantity: 1,

    orderNo: orderNo,

    setItems: [...setItems]

  };


  sales.push(setSale);


  saveSales(sales);


  /*
    セット登録完了
  */

  setItems = [];

  selectedProduct = null;

  document.getElementById("productName").value = "";

  document.getElementById("price").value = "";

  document.getElementById("cost").value = "";

  document.getElementById("quantity").value = "1";

  document.getElementById("quantityDisplay").textContent = "1";

  document.getElementById("orderNo").value = "";


  render();


  alert("セット販売を登録しました！");

}
  function updateSetItemPrice(saleIndex, itemIndex, value){

  const sales = getSales();

  const sale = sales[saleIndex];

  if(!sale || !sale.isSet || !Array.isArray(sale.setItems)){
    return;
  }

  const newPrice = Number(value);

  if(!newPrice || newPrice < 0){
    alert("金額を入力してください");
    render();
    return;
  }

  sale.setItems[itemIndex].price = newPrice;

  sale.price =
    sale.setItems.reduce(
      (sum, item) => sum + Number(item.price || 0),
      0
    );
    delete sale.profitOverride;

  saveSales(sales);

  render();
}
  function updateSetTotalPrice(saleIndex, value){

  const sales = getSales();

  const sale = sales[saleIndex];

  if(!sale || !sale.isSet){
    return;
  }

  const newPrice = Number(value);

  if(!newPrice || newPrice < 0){
    alert("金額を入力してください");
    render();
    return;
  }

  sale.price = newPrice;
    sale.discount = Math.max(
  0,
  Number(sale.originalTotalPrice || 0) - newPrice
);

  delete sale.profitOverride;

  saveSales(sales);

  render();

}
  function updateSetProfit(saleIndex, value){

  const sales = getSales();

  const sale = sales[saleIndex];

  if(!sale || !sale.isSet){
    return;
  }

  const newProfit = Number(value);

  if(isNaN(newProfit) || newProfit < 0){
    alert("粗利を入力してください");
    render();
    return;
  }

  sale.profitOverride = newProfit;

  saveSales(sales);

  render();

}
function deleteSale(index){

  const sales = getSales();

  sales.splice(index,1);

  saveSales(sales);

  render();

}


function render(){

  const sales = getSales();

  const table = document.getElementById("salesTable");

  const empty = document.getElementById("emptyMessage");


  table.innerHTML = "";


  let totalSales = 0;

  let totalQty = 0;

  let totalProfit = 0;

  let totalDiscount = 0;

  let totalCost = 0;

  sales.forEach((sale,index)=>{

    const saleTotal =
      sale.price * sale.quantity;

    const costTotal =
      sale.cost * sale.quantity;

    const shippingTotal =

  sale.shipping * sale.quantity;
const mercariFee =
  saleTotal * 0.10;
const profit =

  saleTotal - costTotal - shippingTotal - mercariFee;

    totalSales += saleTotal;

    totalQty +=
  sale.isSet && Array.isArray(sale.setItems)
    ? sale.setItems.length
    : sale.quantity;

    totalProfit += profit;
totalDiscount += Number(sale.discount || 0);
totalCost += costTotal;
    const tr = document.createElement("tr");


   tr.innerHTML = `
<td>No.${index + 1}</td>
<td>
  ${
    sale.isSet && Array.isArray(sale.setItems)
      ? `
        <div>
          ${Object.values(sale.setItems.reduce((groups,item)=>{
  const key = item.productId || item.productName;
  if(!groups[key]){
    groups[key] = { item:item, count:0 };
  }
  groups[key].count++;
  return groups;
},{})).map(({item,count}) => `
            <div style="margin:8px 0;font-size:14px;">
              ${escapeHtml(item.category || "")} / ${escapeHtml(item.productName || "")}<br>
             ${escapeHtml(item.base || "")} / ${escapeHtml(item.version || "")} / ${escapeHtml(item.model || "")} ×${count}
            </div>
          `).join("")}
        </div>
      `
      : `
        ${escapeHtml(sale.category || "")} / ${escapeHtml(sale.productName || "")}<br>
        ${escapeHtml(sale.base || "")} / ${escapeHtml(sale.version || "")} / ${escapeHtml(sale.model || "")}
      `
  }
</td>

<td>
  ${
    sale.isSet
      ? `
        <input
          type="number"
          value="${Number(sale.price || 0)}"
          style="width:120px;padding:8px;border:1px solid #ddd;border-radius:8px;text-align:right;font-size:16px;"
          onchange="updateSetTotalPrice(${index}, this.value)"
        >
      `
      : `¥${saleTotal.toLocaleString()}`
  }
</td>

 <td>${
  sale.isSet && Array.isArray(sale.setItems)
    ? sale.setItems.length
    : sale.quantity
}</td>

  <td>¥${costTotal.toLocaleString()}</td>

  <td>
  ${
    sale.isSet
      ? `
        <input
          type="number"
          value="${Number(sale.profitOverride ?? profit)}"
          style="width:120px;padding:6px 8px;border:1px solid #ddd;border-radius:10px;"
          onchange="updateSetProfit(${index}, this.value)"
        >
      `
      : `¥${profit.toLocaleString()}`
  }
</td>

  <td>
    <button class="delete"
      onclick="deleteSale(${index})">
      削除
    </button>
  </td>

`;


    table.appendChild(tr);

  });


  document.getElementById("totalSales").textContent =
    "¥" + totalSales.toLocaleString();

  document.getElementById("totalQty").textContent =
    totalQty.toLocaleString();

  document.getElementById("totalOrders").textContent =
    sales.length.toLocaleString();

  document.getElementById("totalProfit").textContent =
    "¥" + totalProfit.toLocaleString();
document.getElementById("totalDiscount").textContent =
  "¥" + totalDiscount.toLocaleString();
document.getElementById("totalCost").textContent =
  "¥" + totalCost.toLocaleString();
  empty.style.display =
    sales.length === 0 ? "block" : "none";

}


function escapeHtml(text){

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


async function loadSalesFromSupabase(){

  const { data, error } = await db
    .from("sales")
    .select("*")
    .eq("sale_date", salesDate.value)
    .order("id", { ascending:true });

  if(error){
    console.error("Supabase売上読み込みエラー:", error);
    return;
  }

  const sales = data.map(row => ({
    productName: row.product_name || "",
    model: row.model || "",
    base: row.base || "",
    version: row.version || "",
    productId: row.product_id || null,
    category: row.category || "",
    itemType: row.item_type || "",
    region: row.region || "",
    countryOrClub: row.country_or_club || "",
    originalTotalPrice: Number(row.original_total_price || 0),
    price: Number(row.price || 0),
    discount: Number(row.discount || 0),
    cost: Number(row.cost || 0),
    shipping: Number(row.shipping || 0),
    quantity: Number(row.quantity || 1),
    orderNo: row.order_no || "",
    isSet: !!row.is_set,
    setItems: Array.isArray(row.set_items)
      ? row.set_items
      : [],
  }));

  localStorage.setItem(
    getStorageKey(),
    JSON.stringify(sales)
  );

  render();
}

});

  );

  const yyyy =
    current.getFullYear();

  const mm =
    String(current.getMonth() + 1)
      .padStart(2,"0");

  const dd =
    String(current.getDate())
      .padStart(2,"0");

  input.value =
    `${yyyy}-${mm}-${dd}`;

  loadSales();
}
