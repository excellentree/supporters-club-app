
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SUPPORTERS ROOM | SUPPORTERS CULB</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#101010;
  color:#f4f0e8;
  font-family:Arial,"Noto Sans JP",sans-serif;
}

button{
  font:inherit;
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

header{
  padding:25px 20px;
  border-bottom:1px solid #35312a;
  text-align:center;
}

.logo{
  font-size:24px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#c9a96e;
}

.header-sub{
  margin-top:8px;
  font-size:10px;
  letter-spacing:4px;
  color:#9c927e;
}

.hero{
  padding:65px 20px 35px;
  text-align:center;
}

.hero-label{
  color:#c9a96e;
  font-size:11px;
  letter-spacing:5px;
}

.hero h1{
  margin:18px 0 12px;
  font-size:clamp(32px,8vw,62px);
  letter-spacing:3px;
  font-weight:900;
}

.hero p{
  color:#aaa;
  font-size:13px;
  line-height:1.8;
}

.gold-line{
  width:55px;
  height:2px;
  background:#c9a96e;
  margin:25px auto;
}

/* 特集スライダー */

.slider-section{
  padding:15px 0 45px;
  overflow:hidden;
}

.slider{
  position:relative;
  width:100%;
  max-width:1100px;
  margin:auto;
  overflow:hidden;
}

.track{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:18px;
  padding:25px 0;
  perspective:1000px;
  touch-action:pan-y;
  transition:transform .4s ease;
  will-change:transform;
}

.feature-card{
  position:relative;
  flex:0 0 58%;
  width:58%;
  max-width:430px;
  min-width:0;
  background:#191919;
  border:1px solid #4a4030;
  padding:10px;
  border-radius:3px;
  opacity:.5;
  transform:scale(.82);
  transition:
    transform .35s ease,
    opacity .35s ease,
    border-color .35s ease;
  cursor:pointer;
  overflow:hidden;
}

.feature-card.active{
  opacity:1;
  transform:scale(1);
  border-color:#c9a96e;
  z-index:2;
}

.feature-card.prev{
  transform:scale(.82) rotateY(8deg);
}

.feature-card.next{
  transform:scale(.82) rotateY(-8deg);
}

.cover{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  display:block;
  background:#111;
}

.card-info{
  padding:17px 8px 12px;
  text-align:center;
}

.card-label{
  color:#c9a96e;
  font-size:9px;
  letter-spacing:3px;
}

.card-title{
  margin:10px 0 8px;
  font-size:clamp(14px,3.5vw,22px);
  font-weight:800;
  line-height:1.4;
  overflow-wrap:anywhere;
}

.card-description{
  color:#aaa;
  font-size:12px;
  line-height:1.7;
  overflow-wrap:anywhere;
}

.card-open{
  margin-top:15px;
  padding:10px;
  border:1px solid #8d7449;
  color:#c9a96e;
  font-size:11px;
  letter-spacing:2px;
}

.slider-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;
  margin-top:5px;
}

.arrow{
  width:42px;
  height:42px;
  border:1px solid #514632;
  background:#191919;
  color:#c9a96e;
  border-radius:50%;
  font-size:20px;
}

.arrow:disabled{
  opacity:.35;
  cursor:default;
}

.dots{
  display:flex;
  align-items:center;
  gap:8px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#555;
  border:0;
  padding:0;
  transition:all .25s ease;
}

.dot.active{
  width:20px;
  border-radius:5px;
  background:#c9a96e;
}

/* 詳細 */

.detail{
  display:none;
  max-width:900px;
  margin:20px auto 70px;
  padding:20px;
}

.detail.show{
  display:block;
}

.detail-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #4b4030;
  padding-bottom:15px;
  margin-bottom:25px;
  gap:15px;
}

.detail-label{
  color:#c9a96e;
  font-size:11px;
  letter-spacing:3px;
}

.close-detail{
  border:1px solid #555;
  background:#222;
  color:#ddd;
  padding:8px 15px;
  white-space:nowrap;
}

.detail-main{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:30px;
  align-items:start;
}

.detail-cover{
  width:100%;
  display:block;
  border:1px solid #665333;
  background:#181818;
}

.detail-content h2{
  font-size:clamp(24px,5vw,38px);
  line-height:1.3;
  margin:0 0 18px;
  overflow-wrap:anywhere;
}

.detail-content p{
  color:#aaa;
  font-size:14px;
  line-height:2;
  white-space:pre-line;
  overflow-wrap:anywhere;
}

.detail-gallery{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
  margin-top:30px;
}

.detail-gallery img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#181818;
  border:1px solid #39332a;
  cursor:pointer;
}

.status{
  text-align:center;
  color:#c9a96e;
  font-size:13px;
  padding:25px 15px;
  line-height:1.8;
}

.empty{
  width:100%;
  text-align:center;
  color:#888;
  padding:45px 20px;
  line-height:2;
}

footer{
  border-top:1px solid #35312a;
  padding:30px 20px;
  text-align:center;
  color:#777;
  font-size:10px;
  letter-spacing:2px;
}

@media(max-width:650px){
  .track{
    gap:10px;
  }

  .feature-card{
    flex-basis:68%;
    width:68%;
    padding:7px;
  }

  .feature-card.prev,
  .feature-card.next{
    transform:scale(.82);
  }

  .card-info{
    padding:12px 5px 8px;
  }

  .card-description{
    font-size:11px;
  }

  .detail{
    padding:15px;
  }

  .detail-main{
    grid-template-columns:1fr;
    gap:20px;
  }

  .detail-cover{
    max-width:430px;
    margin:auto;
  }

  .detail-gallery{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }
}

@media(prefers-reduced-motion:reduce){
  html{
    scroll-behavior:auto;
  }

  .track,
  .feature-card,
  .dot{
    transition:none;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">SUPPORTERS <span>CULB</span></div>
  <div class="header-sub">FOOTBALL COLLECTION</div>
</header>

<section class="hero">
  <div class="hero-label">EXCLUSIVE COLLECTION</div>
  <h1>SUPPORTERS<br>ROOM</h1>
  <p>
    特別なコレクションを、ここに。<br>
    SUPPORTERS CULBの特集ページ
  </p>
  <div class="gold-line"></div>
</section>

<section class="slider-section">
  <div class="slider">
    <div id="track" class="track">
      <div class="status">特集を読み込んでいます...</div>
    </div>

    <div class="slider-controls">
      <button id="prev" class="arrow" aria-label="前の特集">‹</button>
      <div id="dots" class="dots"></div>
      <button id="next" class="arrow" aria-label="次の特集">›</button>
    </div>
  </div>
</section>

<section id="detail" class="detail">
  <div class="detail-top">
    <div class="detail-label">SPECIAL COLLECTION</div>
    <button id="closeDetail" class="close-detail">閉じる ×</button>
  </div>

  <div id="detailStatus" class="status"></div>
  <div id="detailMain" class="detail-main"></div>
  <div id="detailGallery" class="detail-gallery"></div>
</section>

<footer>
  © SUPPORTERS CULB
</footer>

<script>
const API =
  "https://supporters-image-api.excellentree-55.workers.dev";

const $ = id => document.getElementById(id);

let features = [];
let currentIndex = 0;
let touchStartX = 0;
let touchStartY = 0;
let sliderResizeTimer = null;

// 画像URL
function imageUrl(key){
  if(!key) return "";

  return API + "/image/" +
    key.split("/").map(encodeURIComponent).join("/");
}

// HTMLに文字を安全に表示
function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  }[char]));
}

// 表紙URL
function getCover(feature){
  return feature.coverUrl || imageUrl(feature.coverKey);
}

// 特集一覧を読み込む
async function loadFeatures(){
  try{
    const response = await fetch(API + "/public-features");

    if(!response.ok){
      throw new Error("特集を取得できませんでした");
    }

    const data = await response.json();

    features = (data.features || [])
      .filter(feature => feature.published === true)
      .sort((a,b) =>
        Number(a.sortOrder || 0) -
        Number(b.sortOrder || 0)
      );

    currentIndex = 0;

    if(!features.length){
      $("track").innerHTML = `
        <div class="empty">
          現在公開中の特集はありません。
        </div>
      `;

      $("dots").innerHTML = "";
      $("prev").style.display = "none";
      $("next").style.display = "none";
      return;
    }

    renderSlider();

  }catch(error){
    $("track").innerHTML = `
      <div class="empty">
        特集を読み込めませんでした。<br>
        ${escapeHTML(error.message)}
      </div>
    `;

    $("dots").innerHTML = "";
    $("prev").style.display = "none";
    $("next").style.display = "none";
  }
}

// スライダー描画
function renderSlider(){
  const track = $("track");
  track.innerHTML = "";

  features.forEach((feature,index) => {
    const card = document.createElement("article");

    card.className = "feature-card";
    card.dataset.index = index;
    card.setAttribute("role","button");
    card.setAttribute("tabindex","0");
    card.setAttribute(
      "aria-label",
      feature.title + "の特集を見る"
    );

    card.innerHTML = `
      <img
        class="cover"
        src="${escapeHTML(getCover(feature))}"
        alt="${escapeHTML(feature.title)}"
        loading="${index === 0 ? "eager" : "lazy"}"
      >

      <div class="card-info">
        <div class="card-label">SPECIAL COLLECTION</div>

        <div class="card-title">
          ${escapeHTML(feature.title)}
        </div>

        <div class="card-description">
          ${escapeHTML(feature.description || "")}
        </div>

        <div class="card-open">VIEW COLLECTION</div>
      </div>
    `;

    card.addEventListener("click",() => {
      if(index !== currentIndex){
        currentIndex = index;
        updateSlider();
      }else{
        openFeature(feature);
      }
    });

    card.addEventListener("keydown",event => {
      if(event.key === "Enter" || event.key === " "){
        event.preventDefault();

        if(index !== currentIndex){
          currentIndex = index;
          updateSlider();
        }else{
          openFeature(feature);
        }
      }
    });

    track.append(card);
  });

  renderDots();
  updateSlider();

  $("prev").style.display =
    features.length > 1 ? "" : "none";

  $("next").style.display =
    features.length > 1 ? "" : "none";
}

// ドット描画
function renderDots(){
  const dots = $("dots");
  dots.innerHTML = "";

  features.forEach((feature,index) => {
    const dot = document.createElement("button");

    dot.className = "dot";
    dot.setAttribute(
      "aria-label",
      "特集 " + (index + 1) + " を表示"
    );

    dot.onclick = () => {
      currentIndex = index;
      updateSlider();
    };

    dots.append(dot);
  });
}

// スライダー位置更新
function updateSlider(){
  const track = $("track");
  const cards = [...track.querySelectorAll(".feature-card")];
  const dots = [...$("dots").querySelectorAll(".dot")];

  if(!cards.length) return;

  currentIndex = Math.max(
    0,
    Math.min(currentIndex, cards.length - 1)
  );

  cards.forEach((card,index) => {
    card.classList.remove("active","prev","next");

    if(index === currentIndex){
      card.classList.add("active");
    }else if(index === currentIndex - 1){
      card.classList.add("prev");
    }else if(index === currentIndex + 1){
      card.classList.add("next");
    }
  });

  dots.forEach((dot,index) => {
    dot.classList.toggle("active",index === currentIndex);
  });

  // 選択中のカードを中央に配置
  const activeCard = cards[currentIndex];

  const cardCenter =
    activeCard.offsetLeft +
    activeCard.offsetWidth / 2;

  const trackCenter =
    track.parentElement.clientWidth / 2;

  const translateX =
    trackCenter - cardCenter;

  track.style.transform =
    `translateX(${translateX}px)`;

  $("prev").disabled = features.length <= 1;
  $("next").disabled = features.length <= 1;
}

// 次の特集
function nextFeature(){
  if(!features.length) return;

  currentIndex =
    (currentIndex + 1) % features.length;

  updateSlider();
}

// 前の特集
function prevFeature(){
  if(!features.length) return;

  currentIndex =
    (currentIndex - 1 + features.length) %
    features.length;

  updateSlider();
}

$("next").onclick = nextFeature;
$("prev").onclick = prevFeature;

// 画面サイズ変更時に中央位置を再計算
window.addEventListener("resize",() => {
  clearTimeout(sliderResizeTimer);

  sliderResizeTimer = setTimeout(() => {
    updateSlider();
  },100);
});

// スワイプ操作
$("track").addEventListener("touchstart",event => {
  if(!event.changedTouches.length) return;

  touchStartX = event.changedTouches[0].screenX;
  touchStartY = event.changedTouches[0].screenY;
},{passive:true});

$("track").addEventListener("touchend",event => {
  if(!event.changedTouches.length) return;

  const touchEndX = event.changedTouches[0].screenX;
  const touchEndY = event.changedTouches[0].screenY;

  const distanceX = touchEndX - touchStartX;
  const distanceY = touchEndY - touchStartY;

  // 縦スクロールの操作は無視
  if(Math.abs(distanceY) > Math.abs(distanceX)) return;

  if(Math.abs(distanceX) < 45) return;

  if(distanceX < 0){
    nextFeature();
  }else{
    prevFeature();
  }
},{passive:true});

// 特集詳細
async function openFeature(feature){
  const detail = $("detail");

  detail.classList.add("show");

  $("detailStatus").textContent =
    "特集を読み込んでいます...";

  $("detailMain").innerHTML = "";
  $("detailGallery").innerHTML = "";

  detail.scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

  try{
    const response = await fetch(
      API + "/public-feature?slug=" +
      encodeURIComponent(feature.slug)
    );

    if(!response.ok){
      throw new Error(
        "特集詳細を取得できませんでした"
      );
    }

    const data = await response.json();

    const item = data.feature || feature;

    // Workerは画像一覧を objects で返す
    const images = Array.isArray(data.objects)
      ? data.objects
      : [];

    $("detailStatus").textContent = "";

    $("detailMain").innerHTML = `
      <div>
        <img
          class="detail-cover"
          src="${escapeHTML(item.coverUrl || getCover(item))}"
          alt="${escapeHTML(item.title)}"
        >
      </div>

      <div class="detail-content">
        <div class="card-label">SPECIAL COLLECTION</div>

        <h2>${escapeHTML(item.title)}</h2>

        <p>${escapeHTML(item.description || "")}</p>
      </div>
    `;

    if(!images.length){
      $("detailGallery").innerHTML = `
        <div class="empty">
          この特集の画像はまだありません。
        </div>
      `;
      return;
    }

    images.forEach(image => {
      const src = image.url || imageUrl(image.key);

      if(!src) return;

      const img = document.createElement("img");

      img.src = src;
      img.alt = item.title || "特集画像";
      img.loading = "lazy";

      // 画像をタップすると別タブで表示
      img.addEventListener("click",() => {
        window.open(src,"_blank","noopener");
      });

      $("detailGallery").append(img);
    });

  }catch(error){
    $("detailStatus").textContent =
      "詳細を読み込めませんでした：" +
      error.message;
  }
}

// 詳細を閉じる
$("closeDetail").onclick = () => {
  $("detail").classList.remove("show");
};

// 起動
loadFeatures();
</script>

</body>
</html>
