<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SUPPORTERS CULB 在庫表</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:28px 20px;
}

header h1{
  margin:0;
  font-size:28px;
  letter-spacing:1px;
}

header p{
  margin:8px 0 0;
  color:#aaa;
  font-size:16px;
}

.container{
  padding:28px 20px 60px;
  max-width:1100px;
  margin:auto;
}

.title{
  font-size:30px;
  font-weight:bold;
  margin-bottom:24px;
}

.section{
  background:#fff;
  border-radius:20px;
  padding:22px;
  margin-bottom:24px;
}

.section h2{
  margin:0 0 18px;
  font-size:22px;
}
#versionFilterArea,
#typeFilterArea{
  padding-top:20px;
}

.filter-area label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
}

.filter-area select{
  width:100%;
  padding:12px 14px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:16px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:750px;
}

th{
  color:#777;
  font-size:13px;
  text-align:left;
  padding:12px 10px;
  border-bottom:1px solid #eee;
}

td{
  padding:14px 10px;
  border-bottom:1px solid #eee;
  font-size:14px;
}

.stock-number{
  font-size:18px;
  font-weight:bold;
}

.stock-button{
  border:none;
  background:#111;
  color:#fff;
  width:32px;
  height:32px;
  border-radius:8px;
  font-size:18px;
  font-weight:bold;
  padding:0;
  display:inline-flex;
}
.stock-controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2px;
  width:fit-content;
  margin:0 auto;
}
  
  .stock-number{
  display:inline-block;
  min-width:20px;
  text-align:center;
  font-size:18px;
  font-weight:bold;
  margin:0;
}

.stock-input{
  width:70px;
  padding:8px;
  border:1px solid #ddd;
  border-radius:8px;
  text-align:center;
  font-size:16px;
}

.back{
  display:block;
  text-align:center;
  background:#111;
  color:#fff;
  text-decoration:none;
  padding:16px;
  border-radius:14px;
  font-weight:bold;
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#999;
  padding:30px 10px;
}
th:first-child{
  text-align:center !important;
}

@media(max-width:600px){

  .container{
    padding:22px 16px 50px;
  }

  .title{
    font-size:28px;
  }

  .section{
    padding:18px;
  }
}
</style>
</head>

<body>

<header>
  <h1>SUPPORTERS CULB</h1>
  <p>SALES MANAGEMENT</p>
</header>

<div class="container">

  <div class="title">在庫表</div>

  <div class="section">

    <h2>商品在庫</h2>
    <div class="filter-area">
  <select id="categoryFilter" onchange="filterStock()">
  <option value="">すべて</option>
  <option value="soccerwe">soccerwe</option>
  <option value="LEGO">LEGO</option>
  <option value="アパレル">アパレル</option>
  <option value="キーホルダー">キーホルダー</option>
  <option value="ステッカー">ステッカー</option>
  <option value="フィギュア">フィギュア</option>
  <option value="ペナント">ペナント</option>
  <option value="ピンバッジ">ピンバッジ</option>
  <option value="その他">その他</option>
</select>
      <div class="filter-area" id="versionFilterArea">
  <label for="versionFilter">VERSION</label>
  <select id="versionFilter" onchange="updateModelFilter()">
  <option value="">VERSIONを選択</option>
</select>
</div>
</div>
<div class="filter-area" id="typeFilterArea">
  <label for="typeFilter">国 or クラブ</label>
  <select id="typeFilter" onchange="updateModelFilter()">
    <option value="country">国</option>
    <option value="club">クラブ</option>
  </select>
</div>
    <div class="filter-area">
  <label for="modelFilter">MODEL</label>
 <select id="modelFilter" onchange="filterStock()">
    <option value="">MODELを選択</option>
  </select>
</div>
    <div class="table-wrap">

      <table>

        <thead>
          <tr>
          <th>在庫数</th>

<th>商品名</th>
<th>MODEL</th>
<th>土台</th>
<th>VERSION</th>
<th>仕入価格</th>
          </tr>
        </thead>

        <tbody id="stockTable">
        </tbody>

      </table>

      <div id="emptyMessage" class="empty">
        商品データを読み込んでいます
      </div>

    </div>

  </div>

  <a href="sales.html" class="back">
    売上管理へ戻る
  </a>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://juzrxqrabrvhlwvnvton.supabase.co";
const SUPABASE_KEY = "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
async function changeStock(productId, amount){

  const product = allProducts.find(p => p.id === productId);

  if(!product){
    console.error("商品が見つかりません:", productId);
    return;
  }

  const currentStock = Number(product.stock || 0);
  const newStock = Math.max(0, currentStock + amount);

  // まず画面を即時更新
  product.stock = newStock;

  const row = document
    .querySelector(`button[onclick*="changeStock(${productId},"]`)
    ?.closest("tr");

  if(row){
    const stockNumber = row.querySelector(".stock-number");

    if(stockNumber){
      stockNumber.textContent = newStock;
    }
  }

  // そのあとSupabaseを更新
  const { error: updateError } = await db
    .from("products")
    .update({ stock: newStock })
    .eq("id", productId);

  if(updateError){
    console.error("在庫更新エラー:", updateError);

    // 更新失敗したら元に戻す
    product.stock = currentStock;

    if(row){
      const stockNumber = row.querySelector(".stock-number");

      if(stockNumber){
        stockNumber.textContent = currentStock;
      }
    }

    alert("在庫の更新に失敗しました");
  }

}
  let allProducts = [];
  
async function loadProducts(){

  const { data, error } = await db
    .from("products")
    .select("id,name,price,model,base,version,average_cost,category,item_type,stock")
    .order("model", { ascending:true })
.order("name", { ascending:true });
  
  if(error){
    console.error("商品データ読み込みエラー:", error);
    return;
  }
  allProducts = data || [];
  updateModelFilter();
const table = document.getElementById("stockTable");
const empty = document.getElementById("emptyMessage");

table.innerHTML = "";

data.forEach(product => {

  const tr = document.createElement("tr");

  tr.innerHTML = `
    <td>
  <div class="stock-controls">
    <button type="button" class="stock-button" onclick="changeStock(${product.id}, -1)">−</button>
    <span class="stock-number">${Number(product.stock || 0)}</span>
    <button type="button" class="stock-button" onclick="changeStock(${product.id}, 1)">＋</button>
  </div>
</td>
    
    <td>${product.name || ""}</td>
    <td>${product.model || ""}</td>
    <td>${product.base || ""}</td>
    <td>${product.version || ""}</td>
    <td>¥${Number(product.average_cost || 0).toLocaleString()}</td>
  `;

  table.appendChild(tr);

});

empty.style.display =
  data.length === 0 ? "block" : "none";
  console.log("商品一覧:", data);
}
  function filterStock(){

  const category =
    document.getElementById("categoryFilter").value;

  const model =
    document.getElementById("modelFilter").value;

  const table =
    document.getElementById("stockTable");

  table.innerHTML = "";

  const filtered = allProducts.filter(product => {

    // カテゴリーで絞り込み
    if(category && product.category !== category){
      return false;
    }

    // MODELで絞り込み
    if(model && product.model !== model){
      return false;
    }

    return true;

  });

  filtered.forEach(product => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <div class="stock-controls">
          <button type="button" class="stock-button" onclick="changeStock(${product.id}, -1)">−</button>
          <span class="stock-number">${Number(product.stock || 0)}</span>
          <button type="button" class="stock-button" onclick="changeStock(${product.id}, 1)">＋</button>
        </div>
      </td>

      <td>${product.name || ""}</td>
      <td>${product.model || ""}</td>
      <td>${product.base || ""}</td>
      <td>${product.version || ""}</td>
      <td>¥${Number(product.average_cost || 0).toLocaleString()}</td>
    `;

    table.appendChild(tr);

  });

}

function updateModelFilter(){

  const category =
    document.getElementById("categoryFilter").value;

  const type =
    document.getElementById("typeFilter").value;

  const version =
    document.getElementById("versionFilter").value;

  const modelFilter =
    document.getElementById("modelFilter");

  modelFilter.innerHTML =
    '<option value="">MODELを選択</option>';

  const models = [...new Set(

    allProducts
      .filter(product => {

        // soccerwe
        if(category === "soccerwe"){

          if(type === "country"){
            return product.category === "soccerwe"
              && product.item_type === "代表";
          }

          if(type === "club"){
            return product.category === "soccerwe"
              && product.item_type === "クラブ";
          }

        }

        // その他カテゴリー
        if(category && category !== "soccerwe"){

          return product.category === category
            && product.version === version;

        }

        return false;

      })

      .map(product => product.model)
      .filter(Boolean)

  )];

  models.forEach(model => {

    const option =
      document.createElement("option");

    option.value = model;
    option.textContent = model;

    modelFilter.appendChild(option);

  });

}
function toggleVersionFilter(){

  const category =
    document.getElementById("categoryFilter").value;

  const versionArea =
    document.getElementById("versionFilterArea");

  const typeArea =
    document.getElementById("typeFilterArea");

  const versionFilter =
    document.getElementById("versionFilter");

  if(category === "soccerwe" || category === ""){

    // soccerwe・すべて
    versionArea.style.display = "none";
    typeArea.style.display = "block";

  }else{

    // その他カテゴリー
    versionArea.style.display = "block";
    typeArea.style.display = "none";

    // 選択したカテゴリーのVERSIONだけ表示
    versionFilter.innerHTML =
      '<option value="">VERSIONを選択</option>';

    const versions = [...new Set(
      allProducts
        .filter(product =>
          product.category === category
        )
        .map(product => product.version)
        .filter(Boolean)
    )];

    versions.forEach(version => {

      const option =
        document.createElement("option");

      option.value = version;
      option.textContent = version;

      versionFilter.appendChild(option);

    });

  }

  updateModelFilter();
}
  document
  .getElementById("categoryFilter")
  .addEventListener("change", toggleVersionFilter);

toggleVersionFilter();
loadProducts();
</script>
</body>
</html>
