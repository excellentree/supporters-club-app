
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

const sb = supabase.createClient(

  SUPABASE_KEY

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: radial-gradient(ellipse at top, #292317 0%, #111111 48%);
  color: #ffffff;
}
.container {
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1.5px;
}
.subtitle {
  margin-top: 9px;
  color: #c6a64b;
  font-size: 11px;
  letter-spacing: 4px;
}
.card {
  margin-top: 38px;
  padding: 30px 24px;
  background: linear-gradient(145deg, #222222, #171717);
  border: 1px solid #5a4924;
  border-radius: 22px;
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
}
.lock-icon {
  width: 58px;
  height: 58px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #c6a64b;
  border-radius: 50%;
  color: #d7b65c;
  font-size: 27px;
}
h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
}
.message {
  min-height: 44px;
  margin-top: 12px;
  color: #bdbdbd;
  font-size: 13px;
  line-height: 1.8;
}
.login-input {
  width: 100%;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #5a4924;
  background: #252525;
  color: white;
  font-size: 16px;
}
.login-button {
  width: 100%;
  min-height: 56px;
  border: 1px solid #c6a64b;
  border-radius: 14px;
  background: #514526;
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
}
.login-button:disabled {
  opacity: 0.5;
  cursor: default;
}
.warning {
  margin-top: 23px;
  color: #777777;
  font-size: 10px;
  line-height: 1.8;
}
.shake {
  animation: shake 0.25s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
@media (max-width: 360px) {
  .card {
    padding: 26px 18px;
  }
}
</style>
</head>

<body>
<div class="container">
  <div class="logo">SUPPORTERS CULB</div>
  <div class="subtitle">SALES MANAGEMENT</div>

  <main class="card" id="loginCard">
    <div class="lock-icon">♙</div>
    <h1>管理者ログイン</h1>

    <div class="message" id="message" aria-live="polite">
      メールアドレスとパスワードを入力してください。
    </div>

    <div style="display:grid; gap:14px; margin-top:24px;">
      <input
        id="emailInput"
        class="login-input"
        type="email"
        placeholder="メールアドレス"
        autocomplete="username"
      >

      <input
        id="passwordInput"
        class="login-input"
        type="password"
        placeholder="パスワード"
        autocomplete="current-password"
      >

      <button id="loginButton" class="login-button">
        ログイン
      </button>
    </div>

    <div class="warning">
      ※ 管理者専用ログイン画面です。
    </div>
  </main>
</div>

<script>
const message = document.getElementById("message");
const loginCard = document.getElementById("loginCard");
const emailInput = document.getElementById("emailInput");
const passwordInput = document.getElementById("passwordInput");
const loginButton = document.getElementById("loginButton");

function setMessage(text) {
  message.textContent = text;
}

function showError(text) {
  setMessage(text);
  loginCard.classList.remove("shake");
  void loginCard.offsetWidth;
  loginCard.classList.add("shake");
}

function setLoading(loading) {
  loginButton.disabled = loading;
  loginButton.textContent = loading ? "確認中..." : "ログイン";
}

async function checkAdmin() {
  const { data: { session }, error } = await sb.auth.getSession();

  if (error || !session) {
    console.log("セッションなし:", error);
    return false;
  }

  const { data, error: adminError } = await sb.rpc("is_admin");

  console.log("ログインユーザー:", session.user.id);
  console.log("管理者判定:", data);
  console.log("管理者判定エラー:", adminError);

  if (adminError || data !== true) {
    setMessage(
      "管理者判定に失敗しました: " +
      (adminError?.message || "権限なし")
    );
    await sb.auth.signOut();
    return false;
  }

  return true;
}

async function login() {
  if (loginButton.disabled) return;

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email || !password) {
    showError("メールアドレスとパスワードを入力してください。");
    return;
  }

  setLoading(true);
  setMessage("ログインを確認しています...");

  try {
    const { error } = await sb.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      showError("ログインできませんでした。入力内容を確認してください。");
      return;
    }

    const isAdmin = await checkAdmin();

    if (!isAdmin) {
      showError("管理者権限が確認できませんでした。");
      return;
    }

    setMessage("ログインしました。移動します...");
    window.location.replace("sales.html");

  } catch (error) {
    console.error(error);
    showError("通信エラーが発生しました。");
  } finally {
    setLoading(false);
  }
}

loginButton.addEventListener("click", login);

passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") login();
});

emailInput.addEventListener("keydown", event => {
  if (event.key === "Enter") passwordInput.focus();
});

async function initializeLogin() {
  setLoading(true);

  try {
    if (await checkAdmin()) {
      window.location.replace("sales.html");
      return;
    }
  } catch (error) {
    console.error(error);
  }

  setLoading(false);
  setMessage("メールアドレスとパスワードを入力してください。");
}

initializeLogin();
</script>
</body>
</html>
