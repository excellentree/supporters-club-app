<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#111111">
<title>SUPPORTERS CULB ログイン</title>
<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding: 24px 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: -apple-system, BlinkMacSystemFont,
               "Helvetica Neue", Arial, sans-serif;
  background:
    radial-gradient(ellipse at top, #292317 0%, #111111 48%);
  color: #ffffff;
}
.container {
  width: 100%;
  max-width: 380px;
  text-align: center;
}
.logo {
  font-size: 25px;
  font-weight: 900;
  letter-spacing: 1.5px;
}
.subtitle {
  margin-top: 9px;
  color: #c6a64b;
  font-size: 11px;
  letter-spacing: 4px;
}
.card {
  margin-top: 38px;
  padding: 30px 24px;
  background: linear-gradient(145deg, #222222, #171717);
  border: 1px solid #5a4924;
  border-radius: 22px;
  box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4);
}
.lock-icon {
  width: 58px;
  height: 58px;
  margin: 0 auto 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #c6a64b;
  border-radius: 50%;
  color: #d7b65c;
  font-size: 27px;
}
h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
}
.message {
  min-height: 44px;
  margin-top: 12px;
  color: #bdbdbd;
  font-size: 13px;
  line-height: 1.8;
}
.pin-display {
  display: flex;
  justify-content: center;
  gap: 18px;
  margin: 24px 0 28px;
}
.pin-dot {
  width: 13px;
  height: 13px;
  border: 1px solid #9b854b;
  border-radius: 50%;
  background: #333333;
  transition: background 0.15s, transform 0.15s;
}
.pin-dot.filled {
  background: #d7b65c;
  border-color: #f0d98b;
  transform: scale(1.1);
}
.keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.key {
  min-height: 62px;
  border: 1px solid #45403a;
  border-radius: 14px;
  background: linear-gradient(145deg, #303030, #222222);
  color: #ffffff;
  font-size: 23px;
  font-weight: 600;
  cursor: pointer;
  touch-action: manipulation;
}
.key:active {
  background: #514526;
  border-color: #c6a64b;
  transform: scale(0.97);
}
.key.utility {
  color: #d7b65c;
  font-size: 14px;
  font-weight: 700;
}
.key.zero {
  grid-column: 2;
}
.key:disabled {
  opacity: 0.35;
  cursor: default;
}
.warning {
  margin-top: 23px;
  color: #777777;
  font-size: 10px;
  line-height: 1.8;
}
.shake {
  animation: shake 0.25s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
@media (max-width: 360px) {
  .card {
    padding: 26px 18px;
  }
  .key {
    min-height: 56px;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="logo">SUPPORTERS CULB</div>
  <div class="subtitle">SALES MANAGEMENT</div>
  <main class="card" id="loginCard">
    <div class="lock-icon">♙</div>
    <h1>暗証番号を入力</h1>
    <div class="message" id="message" aria-live="polite">
      4桁の暗証番号を入力してください。
    </div>
    <div class="pin-display" aria-label="入力した桁数">
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
      <span class="pin-dot"></span>
    </div>
    <div class="keypad" id="keypad">
      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key utility" id="clearButton">クリア</button>
      <button class="key zero" data-number="0">0</button>
      <button class="key utility" id="deleteButton">1字戻す</button>
    </div>
    <div class="warning">
      ※ 暗証番号の入力画面です。<br>
      売上データの保護には、別途サーバー側の認証設定が必要です。
    </div>
  </main>
</div>
<script>
/*
 * 仮の画面認証です。
 * 本番運用前に、サーバー側で暗証番号を検証する仕組みに
 * 置き換える必要があります。
 */
const PIN = "1234";
const MAX_ATTEMPTS = 5;
const LOCK_TIME_MS = 30 * 1000;
let enteredPin = "";
let failedAttempts = 0;
let lockedUntil = 0;
let checking = false;
const message = document.getElementById("message");
const loginCard = document.getElementById("loginCard");
const dots = [...document.querySelectorAll(".pin-dot")];
const keypad = document.getElementById("keypad");
const clearButton = document.getElementById("clearButton");
const deleteButton = document.getElementById("deleteButton");
function updateDisplay() {
  dots.forEach((dot, index) => {
    dot.classList.toggle("filled", index < enteredPin.length);
  });
}
function setMessage(text) {
  message.textContent = text;
}
function clearPin() {
  enteredPin = "";
  updateDisplay();
}
function setKeypadDisabled(disabled) {
  keypad.querySelectorAll("button").forEach(button => {
    button.disabled = disabled;
  });
}
function showError(text) {
  setMessage(text);
  loginCard.classList.remove("shake");
  void loginCard.offsetWidth;
  loginCard.classList.add("shake");
}
function checkPin() {
  if (checking || enteredPin.length !== 4) return;
  if (Date.now() < lockedUntil) {
    showError("一時的にロックされています。");
    clearPin();
    return;
  }
  checking = true;
  setKeypadDisabled(true);
  if (enteredPin === PIN) {
    setMessage("認証しました。移動します…");
    /*
     * 認証後に売上管理画面へ移動します。
     * この判定はブラウザ内だけで行われるため、
     * サーバー側のアクセス制御の代わりにはなりません。
     */
    window.location.replace("sales.html");
    return;
  }
  failedAttempts++;
  clearPin();
  if (failedAttempts >= MAX_ATTEMPTS) {
    lockedUntil = Date.now() + LOCK_TIME_MS;
    failedAttempts = 0;
    setMessage("5回間違えたため、30秒間ロックします。");
    setTimeout(() => {
      checking = false;
      setKeypadDisabled(false);
      setMessage("もう一度、暗証番号を入力してください。");
    }, LOCK_TIME_MS);
    return;
  }
  showError("暗証番号が違います。もう一度入力してください。");
  checking = false;
  setKeypadDisabled(false);
}
keypad.addEventListener("click", event => {
  const button = event.target.closest("button");
  if (!button || button.disabled || checking) return;
  if (Date.now() < lockedUntil) {
    showError("一時的にロックされています。");
    return;
  }
  if (button.dataset.number !== undefined) {
    if (enteredPin.length >= 4) return;
    enteredPin += button.dataset.number;
    updateDisplay();
    if (enteredPin.length === 4) {
      checkPin();
    }
    return;
  }
  if (button.id === "clearButton") {
    clearPin();
    setMessage("4桁の暗証番号を入力してください。");
    return;
  }
  if (button.id === "deleteButton") {
    enteredPin = enteredPin.slice(0, -1);
    updateDisplay();
  }
});
/* キーボード入力にも対応 */
document.addEventListener("keydown", event => {
  if (checking || Date.now() < lockedUntil) return;
  if (/^[0-9]$/.test(event.key)) {
    if (enteredPin.length < 4) {
      enteredPin += event.key;
      updateDisplay();
      if (enteredPin.length === 4) {
        checkPin();
      }
    }
  } else if (event.key === "Backspace") {
    enteredPin = enteredPin.slice(0, -1);
    updateDisplay();
  } else if (event.key === "Escape") {
    clearPin();
  }
});
updateDisplay();
</script>
</body>
</html>
