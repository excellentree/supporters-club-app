<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SUPPORTERS CULB 商品登録</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:28px 20px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
  color:#aaa;
}

main{
  padding:20px;
  max-width:600px;
  margin:auto;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:16px;
}

button.selected{
  background:#111;
  color:#fff;
}

.register{
  width:100%;
  background:#111;
  color:#fff;
  border:none;
  font-weight:bold;
  font-size:18px;
}

</style>
</head>

<body>

<header>
  <h1>SUPPORTERS CULB</h1>
  <p>商品登録</p>
</header>

<main>
<div class="card">

  <label>📷 商品画像</label>

  <input
    type="file"
    id="imageInput"
    accept="image/*">

  <img
    id="imagePreview"
    style="display:none;width:100%;margin-top:15px;border-radius:12px;">

</div>
  <div class="card">

    <label>NAME</label>
<input
  type="text"
  id="nameInput"
  placeholder="選手名">

  </div>

  <div class="card">

    <label>VERSION</label>
<input
  type="text"
  id="versionInput"
  placeholder="normal / smiley">

  </div>

  <div class="card">

    <label>MODEL</label>
<input
  type="text"
  id="modelInput"
  placeholder="レアル17-18">

  </div>

  <div class="card">

    <label>土台</label>

    <div class="buttons">

<button type="button" id="actionButton">ACTION</button>
<button type="button" id="fixedButton">FIXED</button>

    </div>

  </div>

  <div class="card">

    <label>PRICE</label>
<input
  type="number"
  id="priceInput"
  placeholder="1080">

  </div>

  <div class="card">

    <label>カテゴリー</label>

    <div class="buttons">

 <button type="button" id="repButton">代表</button>
<button type="button" id="clubButton">クラブ</button>

    </div>

  </div>

  <div class="card">

    <button class="register">
      商品を登録する
    </button>

  </div>

</main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://juzrxqrabrvhlwvnvton.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
document.getElementById("imageInput").addEventListener("change",async function(){

  const file=this.files[0];

  if(!file) return;
  const fileName=
  Date.now()+"-"+file.name;

const {data,error}=await sb
  .storage
  .from("product-images")
  .upload(fileName,file);

if(error){
  alert("画像アップロード失敗");
  console.error(error);
  return;
}

alert("画像アップロード成功！");

  const reader=new FileReader();

  reader.onload=function(e){

    const preview=document.getElementById("imagePreview");

    preview.src=e.target.result;
    preview.style.display="block";

  };

  reader.readAsDataURL(file);

});
let selectedBase = "";

document.getElementById("actionButton").addEventListener("click",function(){

  selectedBase="ACTION";

  document.getElementById("actionButton").style.background="#111";
  document.getElementById("actionButton").style.color="#fff";

  document.getElementById("fixedButton").style.background="";
  document.getElementById("fixedButton").style.color="";

});

document.getElementById("fixedButton").addEventListener("click",function(){

  selectedBase="FIXED";

  document.getElementById("fixedButton").style.background="#111";
  document.getElementById("fixedButton").style.color="#fff";

  document.getElementById("actionButton").style.background="";
  document.getElementById("actionButton").style.color="";

});
let selectedCategory = "";

document.getElementById("repButton").addEventListener("click",function(){

  selectedCategory="代表";

  document.getElementById("repButton").style.background="#111";
  document.getElementById("repButton").style.color="#fff";

  document.getElementById("clubButton").style.background="";
  document.getElementById("clubButton").style.color="";

});

document.getElementById("clubButton").addEventListener("click",function(){

  selectedCategory="クラブ";

  document.getElementById("clubButton").style.background="#111";
  document.getElementById("clubButton").style.color="#fff";

  document.getElementById("repButton").style.background="";
  document.getElementById("repButton").style.color="";

});
</script>
</body>
</html>
