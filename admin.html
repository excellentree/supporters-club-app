  async function loadAdminProducts(){

  const {data,error}=await sb
    .from("products")

  if(error){
    console.error(error);
    return;
  }

  const list=document.getElementById("productList");

  list.innerHTML="";

  data.forEach(function(p){

    const item=document.createElement("div");

    item.style.background="#fff";
    item.style.padding="20px";
    item.style.marginBottom="15px";
    item.style.borderRadius="15px";

    item.innerHTML=`

          style="width:80px;height:80px;object-fit:cover;border-radius:10px;"

          <div style="font-size:20px;font-weight:bold;">
            ${p.name||""}
          </div>

          <div>
            MODEL：${p.model||""}
          </div>

          <div>
            VERSION：${p.version||""}
          </div>

          <div>
            PRICE：¥${p.price||""}
          </div>
<div style="margin-top:15px;">

  <button onclick="editProduct('${p.id}')">
    ✏️ 修正
  </button>

  <button onclick="toggleSoldOut('${p.id}', ${p.sold_out})" style="margin-left:10px;">
    ${p.sold_out ? "↩️ SOLD OUT解除" : "🔴 SOLD OUT"}
  </button>

  <button onclick="deleteProduct(${p.id})" style="margin-left:10px;">
    🗑️ 削除
  </button>

</div>
        </div>

      </div>

    `;

    list.appendChild(item);

  });
}
  async function toggleSoldOut(id, current){
  const { error } = await sb
    .from("products")
    .update({ sold_out: !current })
    .eq("id", id);

  if(error){
    alert("SOLD OUT変更に失敗しました");
    console.error(error);
    return;
  }

  location.reload();
}
  async function deleteProduct(id){
  if(!confirm("この商品を削除しますか？")){
    return;
  }

  const { error } = await sb
    .from("products")
    .delete()
    .eq("id", id);

  if(error){
    alert("削除に失敗しました");
    console.error(error);
    return;
  }

  alert("商品を削除しました");
  location.reload();
}

  "ヨーロッパ":"europeButton",
  "アフリカ":"africaButton",
  "南米":"southAmericaButton",
  "アジア":"asiaButton"
};

const regionButtonId=regionButtonMap[data.region];

if(regionButtonId){

  document.getElementById(regionButtonId).click();

  const areaMap={
    "europeButton":"europeCountryArea",
    "africaButton":"africaCountryArea",
    "southAmericaButton":"southAmericaCountryArea",
    "asiaButton":"asiaCountryArea"
  };

  const area=document.getElementById(areaMap[regionButtonId]);

  if(area){

    const buttons=area.querySelectorAll("button");

    buttons.forEach(function(btn){

      if(btn.textContent.trim()===data.country_or_club){
        btn.click();
      }

    });

  }

}
  document.getElementById("nameInput").value=data.name||"";
  document.getElementById("versionInput").value=data.version||"";
  document.getElementById("modelInput").value=data.model||"";
  document.getElementById("priceInput").value=data.price||"";

  uploadedImageUrl=data.image_url||"";

  const preview=document.getElementById("imagePreview");
  preview.src=data.image_url||"";
  preview.style.display=data.image_url ? "block" : "none";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  alert("商品情報を読み込みました！");
}
window.addEventListener("load",loadAdminProducts);
</script>
