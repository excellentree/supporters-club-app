<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SUPPORTERS CULB 商品登録</title>

<style>

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:28px 20px;
}

header h1{
  margin:0;
  font-size:28px;
}

header p{
  margin:8px 0 0;
  color:#aaa;
}

main{
  padding:20px;
  max-width:600px;
  margin:auto;
}

.card{
  background:#fff;
  padding:20px;
  border-radius:16px;
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:8px;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.buttons{
  display:flex;
  gap:10px;
}

button{
  flex:1;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:16px;
}

button.selected{
  background:#111;
  color:#fff;
}

.register{
  width:100%;
  background:#111;
  color:#fff;
  border:none;
  font-weight:bold;
  font-size:18px;
}

</style>
</head>

<body>

<header>
  <h1>SUPPORTERS CULB</h1>
  <p>商品登録</p>
</header>

<main>
<div class="card">

  <label>📷 商品画像</label>

  <input
    type="file"
    id="imageInput"
    accept="image/*">

  <img
    id="imagePreview"
    style="display:none;width:100%;margin-top:15px;border-radius:12px;">

</div>
  <div class="card">

    <label>NAME</label>
<input
  type="text"
  id="nameInput"
  placeholder="選手名">

  </div>

  <div class="card">

    <label>VERSION</label>
<input
  type="text"
  id="versionInput"
  placeholder="normal / smiley">

  </div>

  <div class="card">

    <label>MODEL</label>
<input
  type="text"
  id="modelInput"
  placeholder="レアル17-18">

  </div>

  <div class="card">

    <label>土台</label>

    <div class="buttons">

<button type="button" id="actionButton">ACTION</button>
<button type="button" id="fixedButton">FIXED</button>

    </div>

  </div>

  <div class="card">

    <label>PRICE</label>
<input
  type="number"
  id="priceInput"
  placeholder="1080">

  </div>

  <div class="card">

    <label>カテゴリー</label>

    <div class="buttons">

 <button type="button" id="repButton">代表</button>
<button type="button" id="clubButton">クラブ</button>

    </div>
<div id="repRegionArea" style="display:none; margin-top:20px;">

  <h2>地域</h2>

  <button type="button" id="europeButton">ヨーロッパ</button>
  <button type="button" id="africaButton">アフリカ</button>
  <button type="button" id="southAmericaButton">南米</button>
  <button type="button" id="asiaButton">アジア</button>

</div>
  </div>
<div id="europeCountryArea" style="display:none; margin-top:20px;">

  <h2>国</h2>

  <button type="button" id="englandButton">イングランド</button>
  <button type="button" id="spainButton">スペイン</button>
  <button type="button" id="italyButton">イタリア</button>
  <button type="button" id="germanyButton">ドイツ</button>
  <button type="button" id="franceButton">フランス</button>

</div>
<div id="africaCountryArea" style="display:none; margin-top:20px;">

  <h2>国</h2>

  <button type="button" id="nigeriaButton">ナイジェリア</button>
  <button type="button" id="senegalButton">セネガル</button>
  <button type="button" id="egyptButton">エジプト</button>
  <button type="button" id="moroccoButton">モロッコ</button>

</div>
  <div id="southAmericaCountryArea" style="display:none; margin-top:20px;">

  <h2>国</h2>

  <button type="button" id="brazilButton">ブラジル</button>
  <button type="button" id="argentinaButton">アルゼンチン</button>
  <button type="button" id="uruguayButton">ウルグアイ</button>
  <button type="button" id="colombiaButton">コロンビア</button>

</div>

  <div id="asiaCountryArea" style="display:none; margin-top:30px;">

  <h2>国</h2>

  <button type="button" id="japanButton">日本</button>
  <button type="button" id="koreaButton">韓国</button>
  <button type="button" id="iranButton">イラン</button>
  <button type="button" id="saudiArabiaButton">サウジアラビア</button>

</div>
  <div class="card">

    <button class="register" id="registerButton">
  商品を登録する
</button>

  </div>

</main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL =
  "https://juzrxqrabrvhlwvnvton.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";

const sb =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
  let uploadedImageUrl = "";
document.getElementById("imageInput").addEventListener("change",async function(){

  const file=this.files[0];

  if(!file) return;
  const fileName=
  Date.now()+"-"+file.name;

const {data,error}=await sb
  .storage
  .from("product-images")
  .upload(fileName,file);

if(error){
  alert("画像アップロード失敗");
  console.error(error);
  return;
}
const {data:publicData}=sb
  .storage
  .from("product-images")
  .getPublicUrl(fileName);

uploadedImageUrl=publicData.publicUrl;
alert("画像アップロード成功！");

  const reader=new FileReader();

  reader.onload=function(e){

    const preview=document.getElementById("imagePreview");

    preview.src=e.target.result;
    preview.style.display="block";

  };

  reader.readAsDataURL(file);

});
let selectedBase = "";

document.getElementById("actionButton").addEventListener("click",function(){

  selectedBase="ACTION";

  document.getElementById("actionButton").style.background="#111";
  document.getElementById("actionButton").style.color="#fff";

  document.getElementById("fixedButton").style.background="";
  document.getElementById("fixedButton").style.color="";

});

document.getElementById("fixedButton").addEventListener("click",function(){

  selectedBase="FIXED";

  document.getElementById("fixedButton").style.background="#111";
  document.getElementById("fixedButton").style.color="#fff";

  document.getElementById("actionButton").style.background="";
  document.getElementById("actionButton").style.color="";

});
let selectedCategory = "";

document.getElementById("repButton").addEventListener("click",function(){

  selectedCategory="代表";

  document.getElementById("repButton").style.background="#111";
  document.getElementById("repButton").style.color="#fff";

  document.getElementById("clubButton").style.background="";
  document.getElementById("clubButton").style.color="";

});

document.getElementById("clubButton").addEventListener("click",function(){

  selectedCategory="クラブ";

  document.getElementById("clubButton").style.background="#111";
  document.getElementById("clubButton").style.color="#fff";

  document.getElementById("repButton").style.background="";
  document.getElementById("repButton").style.color="";

});
  document.getElementById("repButton").addEventListener("click",function(){

  document.getElementById("repRegionArea").style.display="block";

});

document.getElementById("clubButton").addEventListener("click",function(){

  document.getElementById("repRegionArea").style.display="none";

});
  let selectedRegion = "";

const regionButtons = [
  "europeButton",
  "africaButton",
  "southAmericaButton",
  "asiaButton"
];

regionButtons.forEach(function(id){

  document.getElementById(id).addEventListener("click",function(){

    selectedRegion = id;

    regionButtons.forEach(function(otherId){
      document.getElementById(otherId).style.background="";
      document.getElementById(otherId).style.color="";
    });

    document.getElementById(id).style.background="#111";
    document.getElementById(id).style.color="#fff";

  });

});
  document.getElementById("europeButton").addEventListener("click",function(){

  document.getElementById("europeCountryArea").style.display="block";

});

  　let selectedCountry = "";

const countryButtons = [
  "englandButton",
  "spainButton",
  "italyButton",
  "germanyButton",
  "franceButton"
];

countryButtons.forEach(function(id){

  document.getElementById(id).addEventListener("click",function(){

    selectedCountry = id;

    countryButtons.forEach(function(otherId){

      document.getElementById(otherId).style.background="";
      document.getElementById(otherId).style.color="";

    });

    document.getElementById(id).style.background="#111";
    document.getElementById(id).style.color="#fff";

  });

});
document.getElementById("africaButton").addEventListener("click",function(){

  document.getElementById("africaCountryArea").style.display="block";

  document.getElementById("europeCountryArea").style.display="none";

});
  let selectedAfricaCountry = "";

const africaCountryButtons = [
  "nigeriaButton",
  "senegalButton",
  "egyptButton",
  "moroccoButton"
];

africaCountryButtons.forEach(function(id){

  document.getElementById(id).addEventListener("click",function(){

    selectedAfricaCountry = id;

    africaCountryButtons.forEach(function(otherId){

      document.getElementById(otherId).style.background="";
      document.getElementById(otherId).style.color="";

    });

    document.getElementById(id).style.background="#111";
    document.getElementById(id).style.color="#fff";

  });
  });
  
let selectedSouthAmericaCountry = "";

const southAmericaCountryButtons = [
  "brazilButton",
  "argentinaButton",
  "uruguayButton",
  "colombiaButton"
];

southAmericaCountryButtons.forEach(function(id){

  document.getElementById(id).addEventListener("click",function(){

    selectedSouthAmericaCountry = id;

    southAmericaCountryButtons.forEach(function(otherId){

      document.getElementById(otherId).style.background="";
      document.getElementById(otherId).style.color="";

    });

    document.getElementById(id).style.background="#111";
    document.getElementById(id).style.color="#fff";

  });

});

  document.getElementById("southAmericaButton").addEventListener("click",function(){

  document.getElementById("southAmericaCountryArea").style.display="block";

  document.getElementById("europeCountryArea").style.display="none";
  document.getElementById("africaCountryArea").style.display="none";

});
  document.getElementById("europeButton").addEventListener("click",function(){
  document.getElementById("europeCountryArea").style.display="block";
  document.getElementById("africaCountryArea").style.display="none";
  document.getElementById("southAmericaCountryArea").style.display="none";
    document.getElementById("asiaCountryArea").style.display="none";
});

document.getElementById("africaButton").addEventListener("click",function(){
  document.getElementById("europeCountryArea").style.display="none";
  document.getElementById("africaCountryArea").style.display="block";
  document.getElementById("southAmericaCountryArea").style.display="none";
  document.getElementById("asiaCountryArea").style.display="none";
});

document.getElementById("southAmericaButton").addEventListener("click",function(){
  document.getElementById("europeCountryArea").style.display="none";
  document.getElementById("africaCountryArea").style.display="none";
  document.getElementById("southAmericaCountryArea").style.display="block";
  document.getElementById("asiaCountryArea").style.display="none";
});
  let selectedAsiaCountry = "";

const asiaCountryButtons = [
  "japanButton",
  "koreaButton",
  "iranButton",
  "saudiArabiaButton"
];

asiaCountryButtons.forEach(function(id){

  document.getElementById(id).addEventListener("click",function(){

    selectedAsiaCountry = id;

    asiaCountryButtons.forEach(function(otherId){

      document.getElementById(otherId).style.background="";
      document.getElementById(otherId).style.color="";

    });

    document.getElementById(id).style.background="#111";
    document.getElementById(id).style.color="#fff";

  });

});

document.getElementById("asiaButton").addEventListener("click",function(){

  document.getElementById("asiaCountryArea").style.display="block";
  document.getElementById("europeCountryArea").style.display="none";
  document.getElementById("africaCountryArea").style.display="none";
  document.getElementById("southAmericaCountryArea").style.display="none";

});
  document.getElementById("registerButton").addEventListener("click",async function(){

  if(!uploadedImageUrl){
    alert("画像を登録してください");
    return;
  }

  if(!document.getElementById("nameInput").value){
    alert("NAMEを入力してください");
    return;
  }

  if(!document.getElementById("priceInput").value){
    alert("PRICEを入力してください");
    return;
  }

  if(!selectedBase){
    alert("土台を選択してください");
    return;
  }

  if(!selectedCategory){
    alert("カテゴリーを選択してください");
    return;
  }

  if(selectedCategory==="クラブ"){
    alert("クラブ登録は次に対応します");
    return;
  }

  function getSelectedCountryName(){

    if(selectedRegion==="europeButton"){
      return selectedCountry
        ? document.getElementById(selectedCountry).textContent
        : "";
    }

    if(selectedRegion==="africaButton"){
      return selectedAfricaCountry
        ? document.getElementById(selectedAfricaCountry).textContent
        : "";
    }

    if(selectedRegion==="southAmericaButton"){
      return selectedSouthAmericaCountry
        ? document.getElementById(selectedSouthAmericaCountry).textContent
        : "";
    }

    if(selectedRegion==="asiaButton"){
      return selectedAsiaCountry
        ? document.getElementById(selectedAsiaCountry).textContent
        : "";
    }

    return "";
  }

  function getSelectedRegionName(){

    const map={
      europeButton:"ヨーロッパ",
      africaButton:"アフリカ",
      southAmericaButton:"南米",
      asiaButton:"アジア"
    };

    return map[selectedRegion] || "";
  }

  const countryName=getSelectedCountryName();

  if(!selectedRegion || !countryName){
    alert("地域と国を選択してください");
    return;
  }

  const {data,error}=await sb
    .from("products")
    .insert([{
      image_url:uploadedImageUrl,
      name:document.getElementById("nameInput").value,
      version:document.getElementById("versionInput").value,
      model:document.getElementById("modelInput").value,
      base:selectedBase,
      price:Number(document.getElementById("priceInput").value),
      category:"soccerwe",
      item_type:selectedCategory,
      region:getSelectedRegionName(),
      country_or_club:countryName
    }]);

  if(error){
    alert("商品登録失敗");
    console.error(error);
    return;
  }

  alert("商品登録成功！");
      document.getElementById("imageInput").value="";
  uploadedImageUrl="";

  document.getElementById("imagePreview").src="";
  document.getElementById("imagePreview").style.display="none";

  document.getElementById("nameInput").value="";
  document.getElementById("versionInput").value="";
  document.getElementById("modelInput").value="";
  document.getElementById("priceInput").value="";

  selectedBase="";
  selectedCategory="";
  selectedRegion="";
  selectedCountry="";
  selectedAfricaCountry="";
  selectedSouthAmericaCountry="";
  selectedAsiaCountry="";

  document.querySelectorAll("button").forEach(function(btn){
    btn.style.background="";
    btn.style.color="";
  });

  document.getElementById("repRegionArea").style.display="none";
  document.getElementById("europeCountryArea").style.display="none";
  document.getElementById("africaCountryArea").style.display="none";
  document.getElementById("southAmericaCountryArea").style.display="none";
  document.getElementById("asiaCountryArea").style.display="none";

});
  async function loadAdminProducts(){

  const {data,error}=await sb
    .from("products")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    return;
  }

  const list=document.getElementById("productList");

  list.innerHTML="";

  data.forEach(function(p){

    const item=document.createElement("div");

    item.style.background="#fff";
    item.style.padding="20px";
    item.style.marginBottom="15px";
    item.style.borderRadius="15px";

    item.innerHTML=`

      <div style="display:flex;gap:15px;align-items:center;">

        <img
          src="${p.image_url||""}"
          style="width:80px;height:80px;object-fit:cover;border-radius:10px;"
        >

        <div>

          <div style="font-size:20px;font-weight:bold;">
            ${p.name||""}
          </div>

          <div>
            MODEL：${p.model||""}
          </div>

          <div>
            VERSION：${p.version||""}
          </div>

          <div>
            PRICE：¥${p.price||""}
          </div>
<div style="margin-top:15px;">
  <button onclick="editProduct(${p.id})">
    ✏️ 修正
  </button>
</div>
        </div>

      </div>

    `;

    list.appendChild(item);
let editingProductId = null;

async function editProduct(id){

  const {data,error}=await sb
    .from("products")
    .select("*")
    .eq("id",id)
    .single();

  if(error){
    alert("商品情報を取得できませんでした");
    console.error(error);
    return;
  }

  editingProductId=id;

  document.getElementById("nameInput").value=data.name||"";
  document.getElementById("versionInput").value=data.version||"";
  document.getElementById("modelInput").value=data.model||"";
  document.getElementById("priceInput").value=data.price||"";

  uploadedImageUrl=data.image_url||"";

  const preview=document.getElementById("imagePreview");
  preview.src=data.image_url||"";
  preview.style.display=data.image_url ? "block" : "none";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

  alert("商品情報を読み込みました！");
}
  });
}
window.addEventListener("load",loadAdminProducts);
</script>
  <div class="card">
  <h2>登録済み商品</h2>
  <div id="productList"></div>
</div>
</body>
</html>
