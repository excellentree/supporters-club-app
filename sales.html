<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SUPPORTERS CULB 売上管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:24px 18px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
}

.subtitle{
  margin-top:5px;
  font-size:13px;
  color:#aaa;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:20px 15px 50px;
}

.date-area{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.date-title{
  font-size:20px;
  font-weight:800;
}

.date-input{
  padding:10px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.summary-label{
  font-size:13px;
  color:#777;
  margin-bottom:8px;
}

.summary-value{
  font-size:25px;
  font-weight:800;
}

.section{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.empty{
  text-align:center;
  color:#999;
  padding:35px 10px;
  font-size:14px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.menu-button{
  border:none;
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:16px 10px;
  font-size:14px;
  font-weight:700;
}

.menu-button:active{
  transform:scale(.98);
}

@media(max-width:700px){
  .summary{
    grid-template-columns:repeat(2,1fr);
  }

  .menu{
    grid-template-columns:1fr;
  }

  .date-area{
    align-items:flex-start;
    gap:10px;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">SUPPORTERS CULB</div>
    <div class="subtitle">SALES MANAGEMENT</div>
  </div>
</header>

<div class="container">

  <div class="date-area">
    <div class="date-title">売上管理</div>

    <input
      type="date"
      id="salesDate"
      class="date-input"
    >
  </div>

  <div class="summary">

    <div class="summary-card">
      <div class="summary-label">売上</div>
      <div class="summary-value" id="salesTotal">¥0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">販売数</div>
      <div class="summary-value" id="salesCount">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">注文数</div>
      <div class="summary-value" id="orderCount">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">粗利益</div>
      <div class="summary-value" id="profitTotal">¥0</div>
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      本日の売上
    </div>

    <div class="empty" id="salesList">
      まだ売上データがありません
    </div>

  </div>

  <div class="section">

    <div class="section-title">
      管理メニュー
    </div>

    <div class="menu">

      <button class="menu-button" id="dailyBtn">
        日計表
      </button>

      <button class="menu-button">
        月間売上
      </button>

      <button class="menu-button">
        在庫表
      </button>

    </div>

  </div>

</div>

<script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

const dd = String(today.getDate()).padStart(2,"0");

</body>
</html>
