<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>SUPPORTERS CULB 売上管理</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#fff;
  padding:24px 18px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.logo{
  font-size:24px;
  font-weight:800;
  letter-spacing:1px;
}

.subtitle{
  margin-top:5px;
  font-size:13px;
  color:#aaa;
}

.container{
  max-width:1100px;
  margin:0 auto;
  padding:20px 15px 50px;
}

.date-area{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.date-title{
  font-size:20px;
  font-weight:800;
}

.date-input{
  padding:10px 12px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
  font-size:15px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:14px;
  padding:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.summary-label{
  font-size:13px;
  color:#777;
  margin-bottom:8px;
}

.summary-value{
  font-size:25px;
  font-weight:800;
}

.section{
  background:#fff;
  border-radius:14px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.section-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:15px;
}

.empty{
  text-align:center;
  color:#999;
  padding:35px 10px;
  font-size:14px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.menu-button{
  border:none;
  background:#111;
  color:#fff;
  border-radius:12px;
  padding:16px 10px;
  font-size:14px;
  font-weight:700;
}

.menu-button:active{
  transform:scale(.98);
}

@media(max-width:700px){
  .summary{
    grid-template-columns:repeat(2,1fr);
  }

  .menu{
    grid-template-columns:1fr;
  }

  .date-area{
    align-items:flex-start;
    gap:10px;
    flex-direction:column;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="logo">SUPPORTERS CULB</div>
    <div class="subtitle">SALES MANAGEMENT</div>
  </div>
</header>

<div class="container">

  <div class="date-area">
  <div class="date-title">月計</div>

  <input
    type="month"
    id="salesMonth"
    class="date-input"
  >
</div>

  <div class="summary">

    <div class="summary-card">
      <div class="summary-label">売上</div>
      <div class="summary-value" id="salesTotal">¥0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">販売数</div>
      <div class="summary-value" id="salesCount">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">注文数</div>
      <div class="summary-value" id="orderCount">0</div>
    </div>

    <div class="summary-card">
      <div class="summary-label">粗利益</div>
      <div class="summary-value" id="profitTotal">¥0</div>
    </div>

  </div>

  <div class="section">

    <div class="section-title">
  今月の売上
</div>

    <div class="empty" id="salesList">
      まだ売上データがありません
    </div>

  </div>

  <div class="section">

  
    <div class="section-title">
      管理メニュー
    </div>

    <div class="menu">

      <button class="menu-button" id="dailyBtn" onclick="location.href='daily.html'">
        日計表
      </button>

      <button class="menu-button">
        月間売上
      </button>

      <button class="menu-button">
        在庫表
      </button>

    </div>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL = "https://juzrxqrabrvhlwvnvton.supabase.co";
const SUPABASE_KEY = "sb_publishable_sI16Q-TYswPw6Qyx6Jx0Xg_kPsaBnvv";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const today = new Date();
const yyyy = today.getFullYear();
const mm = String(today.getMonth() + 1).padStart(2,"0");
const dd = String(today.getDate()).padStart(2,"0");
async function loadProducts(){

  const { data, error } = await db
    .from("products")
    .select("id,name,price")
    .order("name", { ascending: true });

  if(error){
    console.error(error);
    return;
  }

}
  loadProducts();
document.getElementById("salesMonth").value =
`${yyyy}-${mm}`;
  document.getElementById("salesMonth").value =
`${yyyy}-${mm}`;
  function loadMonthlySales(){

  const month =
    document.getElementById("salesMonth").value;

  if(!month) return;

  const [year, monthNumber] =
    month.split("-").map(Number);

  const daysInMonth =
    new Date(year, monthNumber, 0).getDate();

  let totalSales = 0;
  let totalQty = 0;
  let totalOrders = 0;
  let totalProfit = 0;
  let totalDiscount = 0;

  for(let day = 1; day <= daysInMonth; day++){

    const date =
      `${year}-${String(monthNumber).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const key =
      "supporters_daily_" + date;

    const sales =
      JSON.parse(localStorage.getItem(key) || "[]");

    sales.forEach(sale => {

      const saleTotal =
        Number(sale.price || 0) *
        Number(sale.quantity || 1);

      const costTotal =
        Number(sale.cost || 0) *
        Number(sale.quantity || 1);

      const shippingTotal =
        Number(sale.shipping || 0) *
        Number(sale.quantity || 1);

      const mercariFee =
        saleTotal * 0.10;

      const profit =
        saleTotal -
        costTotal -
        shippingTotal -
        mercariFee;

      totalSales += saleTotal;

      totalQty +=
        sale.isSet && Array.isArray(sale.setItems)
          ? sale.setItems.length
          : Number(sale.quantity || 0);

      totalOrders += 1;

      totalProfit += profit;

      totalDiscount +=
        Number(sale.discount || 0);

    });

  }

  document.getElementById("salesTotal").textContent =
    "¥" + totalSales.toLocaleString();

  document.getElementById("salesCount").textContent =
    totalQty.toLocaleString();

  document.getElementById("orderCount").textContent =
    totalOrders.toLocaleString();

  document.getElementById("profitTotal").textContent =
    "¥" + totalProfit.toLocaleString();

}
loadMonthlySales();

document.getElementById("salesMonth").addEventListener("change", loadMonthlySales);

document.getElementById("dailyBtn").addEventListener("click", () => {
  location.href = "daily.html";
});
  // 商品検索
const productSearchBtn = document.querySelector('button[id^="prod"]');
const productSearchArea = document.getElementById("productSearchArea");
const productSearch = document.getElementById("productSearch");
const productResults = document.getElementById("productResults");

if(productSearchBtn){
  productSearchBtn.addEventListener("click", () => {
    productSearchArea.style.display = "block";
    productSearch.focus();
  });
}

productSearch.addEventListener("input", async () => {

  const keyword = productSearch.value.trim();

  if(!keyword){
    productResults.innerHTML = "";
    return;
  }

  const { data, error } = await db
    .from("products")
    .select("id,name,price")
    .ilike("name", `%${keyword}%`)
    .order("name", { ascending: false })
    .limit(20);

  if(error){
    console.error(error);
    return;
  }

  productResults.innerHTML = "";

  data.forEach(product => {

    const item = document.createElement("button");

    item.type = "button";
    item.textContent = product.name;

    item.addEventListener("click", () => {

      productSearchBtn.textContent = product.name;
　　　　document.getElementById("productName").value = product.name;
      document.getElementById("price").value = product.price || "";

      productSearch.value = "";
      productResults.innerHTML = "";
      productSearchArea.style.display = "none";

    });

    productResults.appendChild(item);
});
});
</script>

</body>
</html>
